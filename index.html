function renderStopwatch(container) {
  container.innerHTML = `
    <div class="sw-display" id="sw-display">۰۰:۰۰:۰۰٫۰۰۰</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0">
      <button class="btn" id="sw-start">▶ شروع</button>
      <button class="btn" id="sw-lap">🏁 دور</button>
      <button class="btn" id="sw-reset">🔄 ریست</button>
    </div>
    <div class="sw-lap" id="sw-laps"></div>
  `;

  let startTime = 0, elapsed = 0, rafId = null, running = false, laps = [];

  const display = container.querySelector('#sw-display');
  const lapsDiv = container.querySelector('#sw-laps');

  function fmt(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const milli = ms % 1000;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(milli).padStart(3, '0')}`;
  }

  function toFa(str) {
    return str.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  }

  function tick() {
    if (!running) return;
    const now = performance.now();
    display.textContent = toFa(fmt(now - startTime + elapsed));
    rafId = requestAnimationFrame(tick);
  }

  container.querySelector('#sw-start').addEventListener('click', () => {
    if (running) {
      running = false;
      cancelAnimationFrame(rafId);
      elapsed += performance.now() - startTime;
      container.querySelector('#sw-start').textContent = '▶ ادامه';
    } else {
      running = true;
      startTime = performance.now();
      container.querySelector('#sw-start').textContent = '⏸ توقف';
      tick();
    }
  });

  container.querySelector('#sw-lap').addEventListener('click', () => {
    if (!running) return;
    const now = performance.now();
    const total = now - startTime + elapsed;
    const lastLap = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total, diff: total - lastLap });
    const n = laps.length;
    const lap = laps[n - 1];
    lapsDiv.innerHTML = `<div style="font-size:12px;margin-bottom:4px;color:#aaa">دورها</div>` +
      laps.map((l, i) =>
        `<div class="sw-lap">دور ${i + 1}: ${toFa(fmt(l.diff))} — مجموع: ${toFa(fmt(l.total))}</div>`
      ).reverse().join('');
  });

  container.querySelector('#sw-reset').addEventListener('click', () => {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    laps = [];
    display.textContent = toFa(fmt(0));
    lapsDiv.innerHTML = '';
    container.querySelector('#sw-start').textContent = '▶ شروع';
  });
}

/* ─── time-countdown ─── */
function renderCountdown(container) {
  container.innerHTML = `
    <div class="cd-display" id="cd-display">۰۰:۰۰:۰۰</div>
    <div class="input-group" style="display:flex;gap:8px;justify-content:center;margin:12px 0">
      <input type="number" id="cd-h" placeholder="ساعت" min="0" max="99" style="width:70px;text-align:center">
      <input type="number" id="cd-m" placeholder="دقیقه" min="0" max="59" style="width:70px;text-align:center">
      <input type="number" id="cd-s" placeholder="ثانیه" min="0" max="59" style="width:70px;text-align:center">
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="cd-start">▶ شروع</button>
      <button class="btn" id="cd-pause">⏸ مکث</button>
      <button class="btn" id="cd-reset">🔄 ریست</button>
    </div>
  `;

  let total = 0, remaining = 0, timerId = null, paused = true;

  const display = container.querySelector('#cd-display');

  function toFa(str) {
    return str.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  }

  function fmt(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function update() {
    display.textContent = toFa(fmt(remaining));
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.5;
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.value = 1100;
        osc2.type = 'sine';
        gain2.gain.value = 0.5;
        osc2.start();
        osc2.stop(ctx.currentTime + 0.5);
      }, 600);
    } catch (e) { /* ignore */ }
  }

  container.querySelector('#cd-start').addEventListener('click', () => {
    if (!paused) return;
    if (remaining <= 0) {
      const h = parseInt(container.querySelector('#cd-h').value) || 0;
      const m = parseInt(container.querySelector('#cd-m').value) || 0;
      const s = parseInt(container.querySelector('#cd-s').value) || 0;
      total = h * 3600 + m * 60 + s;
      remaining = total;
      if (remaining <= 0) { showToast('لطفاً زمان را وارد کنید', 'warning'); return; }
    }
    paused = false;
    timerId = setInterval(() => {
      remaining--;
      update();
      if (remaining <= 0) {
        clearInterval(timerId);
        paused = true;
        display.textContent = '✅ پایان!';
        beep();
        showToast('زمان به پایان رسید!', 'success');
      }
    }, 1000);
  });

  container.querySelector('#cd-pause').addEventListener('click', () => {
    if (paused) return;
    paused = true;
    clearInterval(timerId);
  });

  container.querySelector('#cd-reset').addEventListener('click', () => {
    paused = true;
    clearInterval(timerId);
    remaining = 0;
    display.textContent = toFa(fmt(0));
    container.querySelector('#cd-h').value = '';
    container.querySelector('#cd-m').value = '';
    container.querySelector('#cd-s').value = '';
  });

  update();
}

/* ─── time-datediff ─── */
function renderDateDiff(container) {
  container.innerHTML = `
    <div class="input-group">
      <label>تاریخ اول:</label>
      <input type="date" id="dd-d1">
    </div>
    <div class="input-group">
      <label>تاریخ دوم:</label>
      <input type="date" id="dd-d2">
    </div>
    <button class="btn" id="dd-calc" style="margin:8px 0">محاسبه</button>
    <div class="result" id="dd-result"></div>
  `;

  container.querySelector('#dd-calc').addEventListener('click', () => {
    const v1 = container.querySelector('#dd-d1').value;
    const v2 = container.querySelector('#dd-d2').value;
    if (!v1 || !v2) { showToast('هر دو تاریخ را وارد کنید', 'warning'); return; }

    const d1 = new Date(v1);
    const d2 = new Date(v2);
    let earlier = d1 < d2 ? d1 : d2;
    let later = d1 < d2 ? d2 : d1;

    const diffMs = later - earlier;
    const totalSeconds = Math.floor(diffMs / 1000);
    const totalMinutes = Math.floor(totalSeconds / 60);
    const totalHours = Math.floor(totalMinutes / 60);
    const totalDays = Math.floor(totalHours / 24);

    // years/months/days breakdown
    let years = later.getFullYear() - earlier.getFullYear();
    let months = later.getMonth() - earlier.getMonth();
    let days = later.getDate() - earlier.getDate();
    if (days < 0) {
      months--;
      const prevMonth = new Date(later.getFullYear(), later.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months < 0) { years--; months += 12; }

    const hours = totalHours % 24;
    const minutes = totalMinutes % 60;
    const seconds = totalSeconds % 60;

    const n = v => String(v).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]).toLocaleString('fa-IR');

    container.querySelector('#dd-result').innerHTML = `
      <div style="text-align:center;line-height:2.2">
        <div><strong>تفاوت:</strong> ${n(years)} سال و ${n(months)} ماه و ${n(days)} روز</div>
        <div style="font-size:13px;color:#aaa">${n(hours)} ساعت و ${n(minutes)} دقیقه و ${n(seconds)} ثانیه</div>
        <hr style="border-color:#333;margin:10px 0">
        <div>مجموع: <strong>${totalDays.toLocaleString('fa-IR')}</strong> روز</div>
        <div>مجموع: <strong>${totalHours.toLocaleString('fa-IR')}</strong> ساعت</div>
        <div>مجموع: <strong>${totalMinutes.toLocaleString('fa-IR')}</strong> دقیقه</div>
      </div>
    `;
  });
}

        <div id="ds-result" class="result"></div>
      </div>
    `;

      var val = parseFloat(container.querySelector('#ds-val').value);
      var fromId = container.querySelector('#ds-from').value;
      var from = units.find(function(u) { return u.id === fromId; });
      if (isNaN(val)) { showToast('لطفاً عدد وارد کنید'); return; }
      var bytes = val * from.factor;
      var html = '';
      units.forEach(function(u) {
        var converted = bytes / u.factor;
        var display = converted < 0.001 ? converted.toExponential(3) : converted.toLocaleString('fa-IR', { maximumFractionDigits: 4 });
        html += '<div class="row"><span class="label">' + u.name + '</span><span class="value">' + display + '</span></div>';
      });
      var el = container.querySelector('#ds-result');
      el.innerHTML = html;
      el.classList.add('show');
    };
  }
});

registerTool({
  id: 'gen-passcheck',
  name: 'قدرت رمز عبور',
  icon: '🛡️',
  category: 'generators',
  keywords: ['رمز', 'عبور', 'قدرت', 'password', 'strength', 'security', 'امنیت'],
  desc: 'بررسی قدرت و امنیت رمز عبور با پیشنهادات بهبود',
  render: function(container) {
    container.innerHTML = `
      <div class="card">
        <div class="input-group">
          <label>رمز عبور خود را وارد کنید:</label>
          <input type="text" id="pc-input" placeholder="رمز عبور..." style="font-size:1.1rem;letter-spacing:2px">
        </div>
        <div id="pc-bar" style="height:8px;background:var(--glass2);border-radius:4px;overflow:hidden;margin:12px 0">
          <div id="pc-fill" style="height:100%;width:0%;border-radius:4px;transition:all .3s"></div>
        </div>
        <div id="pc-label" style="text-align:center;font-weight:700;font-size:.9rem;margin-bottom:12px"></div>
        <div id="pc-details" class="result show" style="display:block"></div>
      </div>
    `;
    var input = container.querySelector('#pc-input');
    var fill = container.querySelector('#pc-fill');
    var label = container.querySelector('#pc-label');
    var details = container.querySelector('#pc-details');
    function check(pw) {
      var score = 0;
      var checks = [];
      if (pw.length >= 8) { score += 1; checks.push({ ok: true, text: 'حداقل ۸ کاراکتر' }); }
      else checks.push({ ok: false, text: 'حداقل ۸ کاراکتر' });
      if (pw.length >= 12) { score += 1; checks.push({ ok: true, text: 'حداقل ۱۲ کاراکتر (عالی)' }); }
      if (/[a-z]/.test(pw)) { score += 1; checks.push({ ok: true, text: 'حروف کوچک (a-z)' }); }
      else checks.push({ ok: false, text: 'حروف کوچک (a-z)' });
      if (/[A-Z]/.test(pw)) { score += 1; checks.push({ ok: true, text: 'حروف بزرگ (A-Z)' }); }
      else checks.push({ ok: false, text: 'حروف بزرگ (A-Z)' });
      if (/[0-9]/.test(pw)) { score += 1; checks.push({ ok: true, text: 'اعداد (0-9)' }); }
      else checks.push({ ok: false, text: 'اعداد (0-9)' });
      if (/[^a-zA-Z0-9]/.test(pw)) { score += 1; checks.push({ ok: true, text: 'کاراکترهای خاص (!@#...)' }); }
      else checks.push({ ok: false, text: 'کاراکترهای خاص (!@#...)' });
      if (!/(.)\1{2,}/.test(pw)) { score += 1; checks.push({ ok: true, text: 'بدون تکرار متوالی' }); }
      else checks.push({ ok: false, text: 'تکرار متوالی وجود دارد' });
      var pct = Math.min(100, Math.round((score / 7) * 100));
      var color, text;
      if (pct < 30) { color = 'var(--danger)'; text = '🔴 ضعیف'; }
      else if (pct < 60) { color = 'var(--warning)'; text = '🟡 متوسط'; }
      else if (pct < 85) { color = 'var(--success)'; text = '🟢 قوی'; }
      else { color = '#00b894'; text = '🟢 بسیار قوی'; }
      fill.style.width = pct + '%';
      fill.style.background = color;
      label.textContent = text;
      label.style.color = color;
      details.innerHTML = checks.map(function(c) {
        return '<div class="row"><span class="label">' + c.text + '</span><span class="value" style="color:' + (c.ok ? 'var(--success)' : 'var(--danger)') + '">' + (c.ok ? '✅' : '❌') + '</span></div>';
      }).join('') + '<div class="row"><span class="label">زمان تخمینی شکست</span><span class="value">' + estimateTime(pw) + '</span></div>';
    }
    function estimateTime(pw) {
      var charset = 0;
      if (/[a-z]/.test(pw)) charset += 26;
      if (/[A-Z]/.test(pw)) charset += 26;
      if (/[0-9]/.test(pw)) charset += 10;
      if (/[^a-zA-Z0-9]/.test(pw)) charset += 33;
      var combos = Math.pow(charset || 1, pw.length);
      var perSec = 1e10;
      var seconds = combos / perSec;
      if (seconds < 1) return 'آنی';
      if (seconds < 60) return Math.round(seconds) + ' ثانیه';
      if (seconds < 3600) return Math.round(seconds/60) + ' دقیقه';
      if (seconds < 86400) return Math.round(seconds/3600) + ' ساعت';
      if (seconds < 86400*365) return Math.round(seconds/86400) + ' روز';
      if (seconds < 86400*365*1000) return Math.round(seconds/(86400*365)) + ' سال';
      if (seconds < 86400*365*1e6) return Math.round(seconds/(86400*365*1000)) + ' هزار سال';
      if (seconds < 86400*365*1e9) return Math.round(seconds/(86400*365*1e6)) + ' میلیون سال';
      return 'بیشتر از عمر جهان 🌌';
    }
    input.addEventListener('input', function() { check(input.value); });
    check('');
  }
});

registerTool({
  id: 'text-num2fa',
  name: 'عدد به حروف فارسی',
  icon: '🔢',
  category: 'text-code',
  keywords: ['عدد', 'حروف', 'فارسی', 'تومان', 'number', 'words', 'persian', 'ریال'],
  desc: 'تبدیل عدد به حروف فارسی (مثلاً ۱۲۳۴ → یک هزار و دویست و سی و چهار)',
  render: function(container) {
    var ones = ['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
    var teens = ['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
    var tens = ['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
    var hundreds = ['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
    var scales = ['','هزار','میلیون','میلیارد','تریلیون'];
    function convert(n) {
      if (n === 0) return 'صفر';
      if (n < 0) return 'منفی ' + convert(-n);
      var parts = [];
      var scaleIdx = 0;
      while (n > 0) {
        var chunk = n % 1000;
        if (chunk > 0) {
          var chunkStr = '';
          var h = Math.floor(chunk / 100);
          var remainder = chunk % 100;
          if (h > 0) chunkStr += hundreds[h];
          if (remainder >= 10 && remainder < 20) {
            if (chunkStr) chunkStr += ' و ';
            chunkStr += teens[remainder - 10];
          } else {
            var t = Math.floor(remainder / 10);
            var o = remainder % 10;
            if (t > 0) { if (chunkStr) chunkStr += ' و '; chunkStr += tens[t]; }
            if (o > 0) { if (chunkStr) chunkStr += ' و '; chunkStr += ones[o]; }
          }
          if (scales[scaleIdx]) chunkStr += ' ' + scales[scaleIdx];
          parts.unshift(chunkStr);
        }
        n = Math.floor(n / 1000);
        scaleIdx++;
      }
      return parts.join(' و ');
    }
    container.innerHTML = `
      <div class="card">
        <div class="input-group">
          <label>عدد را وارد کنید:</label>
          <input type="number" id="n2f-input" value="1234567" style="font-size:1.2rem;direction:ltr">
        </div>
        <div class="input-group">
          <label>واحد:</label>
          <select id="n2f-unit">
            <option value="">بدون واحد</option>
            <option value="تومان" selected>تومان</option>
            <option value="ریال">ریال</option>
            <option value="دلار">دلار</option>
          </select>
        </div>
        <button class="btn btn-primary" id="n2f-convert" style="width:100%">🔢 تبدیل</button>
        <div id="n2f-result" class="result"></div>
      </div>
    `;
    container.querySelector('#n2f-convert').onclick = function() {
      var n = parseInt(container.querySelector('#n2f-input').value);
      var unit = container.querySelector('#n2f-unit').value;
      if (isNaN(n)) { showToast('لطفاً عدد وارد کنید'); return; }
      var words = convert(n);
      var el = container.querySelector('#n2f-result');
      el.innerHTML = '<div style="font-size:1rem;line-height:2.2;font-weight:700;color:var(--accent)">' + words + ' ' + unit + '</div>' +
        '<div style="font-size:.75rem;color:var(--text2);margin-top:8px">' + n.toLocaleString('fa-IR') + ' ' + unit + '</div>';
      el.classList.add('show');
    };
  }
});

registerTool({
  id: 'wheel-fortune',
  name: 'گردونه شانس',
  icon: '🎡',
  category: 'new-tools',
  keywords: ['گردونه', 'شانس', 'چرخش', 'قرعه‌کشی', 'wheel', 'fortune', 'spin', 'random'],
  desc: 'گردونه چرخان برای انتخاب تصادفی از بین گزینه‌های شما',
  render: function(container) {
    var items = ['گزینه ۱', 'گزینه ۲', 'گزینه ۳', 'گزینه ۴', 'گزینه ۵', 'گزینه ۶'];
    var colors = ['#6c5ce7','#00b894','#e17055','#fdcb6e','#74b9ff','#fd79a8'];
    var spinning = false;
    var canvas, ctx;
    function drawWheel(rotation) {
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;
      var cx = w/2, cy = h/2, r = Math.min(cx, cy) - 10;
      ctx.clearRect(0, 0, w, h);
      var sliceAngle = (2 * Math.PI) / items.length;
      items.forEach(function(item, i) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, i * sliceAngle + rotation, (i + 1) * sliceAngle + rotation);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Label
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(i * sliceAngle + sliceAngle/2 + rotation);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(item.length > 8 ? item.substring(0, 7) + '..' : item, r - 15, 6);
        ctx.restore();
      });
      // Center circle and pointer
      ctx.beginPath(); ctx.arc(cx, cy, 25, 0, 2*Math.PI); ctx.fillStyle='#fff'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + 22, cy); ctx.lineTo(cx + 8, cy - 10); ctx.lineTo(cx + 8, cy + 10); ctx.closePath(); ctx.fillStyle='#e74c3c'; ctx.fill();
    }
    function spin() {
      if (spinning || items.length < 2) return;
      spinning = true;
      var totalRot = (Math.random() * 360 + 1440) * Math.PI / 180;
      var start = 0, dur = 4000, startTime = null;
      function animate(ts) {
        if (!startTime) startTime = ts;
        var elapsed = ts - startTime;
        var progress = Math.min(elapsed / dur, 1);
        var ease = 1 - Math.pow(1 - progress, 3);
        drawWheel(ease * totalRot);
        if (progress < 1) { requestAnimationFrame(animate); }
        else {
          spinning = false;
          var sliceAngle = (2 * Math.PI) / items.length;
          var norm = (totalRot % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
          var idx = items.length - 1 - Math.floor(norm / sliceAngle);
          idx = ((idx % items.length) + items.length) % items.length;
          var res = container.querySelector('#wheel-result');
          if (res) res.innerHTML = '🎉 نتیجه: <strong>' + items[idx] + '</strong>';
          showToast('🎉 ' + items[idx]);
        }
      }
      requestAnimationFrame(animate);
    }
    function updateList() {
      var raw = container.querySelector('#wheel-items').value.trim();
      items = raw ? raw.split(/[\n,،]+/).filter(function(s) { return s.trim(); }) : ['گزینه ۱'];
      drawWheel(0);
    }
    container.innerHTML = `
      <div class="card" style="text-align:center;">
        <canvas id="wheelCanvas" width="300" height="300" style="max-width:100%;display:block;margin:0 auto 12px;touch-action:none;border-radius:50%;"></canvas>
        <div id="wheel-result" style="font-size:1.1rem;font-weight:700;min-height:32px;margin:8px 0;color:var(--accent)"></div>
        <button class="btn btn-primary" id="wheel-spin" style="font-size:1.2rem;padding:12px 32px;margin:8px">🎯 بچرخون!</button>
        <div class="input-group" style="text-align:right">
          <label>گزینه‌ها (هر خط یا با کاما جدا کنید):</label>
          <textarea id="wheel-items" rows="3" style="width:100%;font-size:.85rem">${items.join('\n')}</textarea>
        </div>
      </div>
    `;
    canvas = container.querySelector('#wheelCanvas');
    drawWheel(0);
    container.querySelector('#wheel-spin').onclick = spin;
    container.querySelector('#wheel-items').addEventListener('input', updateList);
    canvas.addEventListener('click', spin);
  }
});

registerTool({
  id: 'typing-test',
  name: 'تست سرعت تایپ',
  icon: '⌨️',
  category: 'new-tools',
  keywords: ['تایپ', 'سرعت', 'typing', 'speed', 'کلمات', 'دقیقه', 'wpm'],
  desc: 'تست سرعت تایپ فارسی و انگلیسی با محاسبه WPM و دقت',
  render: function(container) {
    var texts = [
      'این یک متن آزمایشی برای سنجش سرعت تایپ شماست لطفا آن را دقیق تایپ کنید',
      'پایتخت ایران تهران است و این شهر بزرگترین شهر کشور می باشد',
      'The quick brown fox jumps over the lazy dog near the river bank',
    ];
    var currentText = '';
    var startTime = 0;
    var testActive = false;
    var typedChars = 0;
    var errorChars = 0;

    function startTest() {
      currentText = texts[Math.floor(Math.random() * texts.length)];
      startTime = Date.now();
      testActive = true;
      typedChars = 0;
      errorChars = 0;
      var display = container.querySelector('#typing-display');
      var input = container.querySelector('#typing-input');
      var result = container.querySelector('#typing-result');
      display.innerHTML = currentText.split('').map(function(c) { return '<span>' + c + '</span>'; }).join('');
      display.style.display = 'block';
      input.value = '';
      input.style.display = 'block';
      input.disabled = false;
      input.focus();
      result.classList.remove('show');
      container.querySelector('#typing-start').textContent = '🔄 شروع مجدد';
      container.querySelector('#typing-timer').textContent = '0 s';
    }

    function checkInput(val) {
      if (!testActive) return;
      typedChars = val.length;
      var displaySpans = container.querySelector('#typing-display').querySelectorAll('span');
      var correct = 0;
      displaySpans.forEach(function(span, i) {
        span.classList.remove('correct', 'incorrect');
        if (i < val.length) {
          if (val[i] === currentText[i]) { span.classList.add('correct'); correct++; }
          else span.classList.add('incorrect');
        }
      });
      errorChars = val.length - correct;
      var elapsed = (Date.now() - startTime) / 1000;
      container.querySelector('#typing-timer').textContent = Math.round(elapsed) + ' s';
      if (val.length >= currentText.length) {
        finish();
      }
      // Live WPM
      var wpm = val.length > 0 ? Math.round((val.length / 5) / (elapsed / 60)) : 0;
      container.querySelector('#typing-live').textContent = wpm + ' WPM';
    }

    function finish() {
      testActive = false;
      var elapsed = (Date.now() - startTime) / 1000;
      var wpm = Math.round((typedChars / 5) / (elapsed / 60));
      var accuracy = typedChars > 0 ? Math.round((typedChars - errorChars) / typedChars * 100) : 0;
      var result = container.querySelector('#typing-result');
      result.innerHTML = `
        <div class="row"><span class="label">زمان:</span><span class="value">${elapsed.toFixed(1)} ثانیه</span></div>
        <div class="row"><span class="label">سرعت:</span><span class="value" style="font-size:1.2rem">${wpm} WPM</span></div>
        <div class="row"><span class="label">دقت:</span><span class="value" style="color:${accuracy >= 90 ? 'var(--success)' : 'var(--danger)'}">% ${accuracy}</span></div>
        <div class="row"><span class="label">کاراکتر:</span><span class="value">${typedChars}</span></div>
      `;
      result.classList.add('show');
      container.querySelector('#typing-input').disabled = true;
      container.querySelector('#typing-timer').textContent = elapsed.toFixed(1) + ' s';
    }

    container.innerHTML = `
      <div class="card">
        <div style="text-align:center;margin-bottom:12px">
          <span id="typing-timer" style="font-weight:900;font-size:1.3rem;color:var(--accent)">0 s</span>
          <span style="margin:0 10px;color:var(--text2)">|</span>
          <span id="typing-live" style="font-weight:700;color:var(--text2)">0 WPM</span>
        </div>
        <div id="typing-display" style="display:none;font-size:1.15rem;line-height:2.2;padding:12px;background:var(--glass);border-radius:10px;margin-bottom:10px;direction:ltr;text-align:left;white-space:normal;word-break:break-all;min-height:50px"></div>
        <textarea id="typing-input" placeholder="متن بالا را اینجا تایپ کنید..." rows="3" style="display:none;width:100%;direction:ltr;text-align:left;font-size:1rem" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <button class="btn btn-primary" id="typing-start" style="width:100%;margin-top:10px">▶ شروع تست</button>
        <div id="typing-result" class="result"></div>
      </div>
    `;

    container.querySelector('#typing-start').onclick = startTest;
    container.querySelector('#typing-input').addEventListener('input', function() {
      checkInput(this.value);
    });

    // Add CSS for typing highlights
    var style = document.createElement('style');
    style.textContent = '#typing-display span.correct{color:#00b894;background:rgba(0,184,148,.15)} #typing-display span.incorrect{color:#e17055;background:rgba(225,112,85,.15);text-decoration:underline}';
    container.appendChild(style);
  }
});

        var diffWeeks = Math.floor(diffDays / 7);
        var diffMonths = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth());
        var diffYears = e.getFullYear() - s.getFullYear();
        var res = div.querySelector('#dt-diff-result');

          <div class="row"><span class="label">از:</span><span class="value">${toFaDate(s)}</span></div>

    function renderAdd() {
      var div = container.querySelector('#date-tab-content');
      div.innerHTML = `
        <div class="input-group">

        <div id="dt-add-result" class="result"></div>
      `;
      div.querySelector('#dt-add-btn').onclick = function() {
        var base = new Date(div.querySelector('#dt-base').value);
        var days = parseInt(div.querySelector('#dt-add').value) || 0;
        if (isNaN(base.getTime())) { showToast('تاریخ معتبر وارد کنید'); return; }

        var res = div.querySelector('#dt-add-result');
        res.innerHTML = `
          <div class="row"><span class="label">تاریخ شروع:</span><span class="value">${toFaDate(base)}</span></div>

        res.classList.add('show');

    }

          <textarea id="rl-items" rows="6" placeholder="مثلاً:\nعلی\nمریم\nحسین\nزهرا\nرضا" style="width:100%">علی\nمریم\nحسین\nزهرا\nرضا</textarea>
        </div>

          <button class="btn" id="rl-shuffle">🔀 ترتیب تصادفی</button>
          <button class="btn btn-primary" id="rl-pick">🎯 انتخاب یکی</button>
        </div>
        <div class="inline-inputs" style="margin-bottom:10px">
          <div class="input-group">
            <label>انتخاب چندتا:</label>
            <input type="number" id="rl-count" value="3" min="1" style="direction:ltr;text-align:right">
          </div>
          <button class="btn" id="rl-pickn" style="align-self:flex-end">✅ انتخاب</button>
        </div>
        <div id="rl-result" class="result"></div>
      </div>
    `;

    function getItems() {
      return container.querySelector('#rl-items').value.split(/[\n,،]+/).map(function(s) { return s.trim(); }).filter(Boolean);
    }

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function showResult(title, items) {
      var res = container.querySelector('#rl-result');
      res.innerHTML = '<div style="font-weight:700;margin-bottom:8px;color:var(--accent)">' + title + '</div>' +
        items.map(function(item, i) {
          return '<div class="row" style="padding:8px 0"><span style="color:var(--text2)">#' + (i+1).toLocaleString('fa-IR') + '</span><span style="font-weight:700">' + item + '</span></div>';
        }).join('');
      res.classList.add('show');
    }

    container.querySelector('#rl-shuffle').onclick = function() {
      var items = getItems();
      if (items.length === 0) { showToast('حداقل یک آیتم وارد کنید'); return; }
      showResult('🔀 ترتیب تصادفی (' + items.length.toLocaleString('fa-IR') + ' آیتم)', shuffle(items));
    };

    container.querySelector('#rl-pick').onclick = function() {
      var items = getItems();
      if (items.length === 0) { showToast('حداقل یک آیتم وارد کنید'); return; }
      var pick = items[Math.floor(Math.random() * items.length)];
      showToast('🎯 انتخاب شد: ' + pick);
      showResult('🎯 انتخاب تصادفی', [pick]);
    };

    container.querySelector('#rl-pickn').onclick = function() {
      var items = getItems();
      var n = parseInt(container.querySelector('#rl-count').value) || 1;
      if (items.length === 0) { showToast('حداقل یک آیتم وارد کنید'); return; }
      n = Math.min(n, items.length);
      var picked = shuffle(items).slice(0, n);
      showResult('✅ ' + n.toLocaleString('fa-IR') + ' مورد انتخاب شده', picked);
    };
  }
});

// Toolbox Pro — Split View Support
// ═══════════════════════════════════════════
var _splitMode = false;
var _splitToolA = null, _splitToolB = null;

window.__toggleSplitView = function(toolId) {
  if (!_splitMode) {
    _splitToolA = toolId;
    _splitToolB = null;
    _splitMode = true;
    renderSplitView();
  } else if (!_splitToolB) {
    _splitToolB = toolId;
    renderSplitView();

    _splitMode = false;
    _splitToolA = null;
    _splitToolB = null;
    showHome();
  }
};

function renderSplitView() {
  homePage.style.display = 'none';
  toolPage.style.display = 'block';
  var tA = _splitToolA ? getTool(_splitToolA) : null;
  var tB = _splitToolB ? getTool(_splitToolB) : null;

  pageTitle.textContent = (tA ? tA.name : '') + (tB ? ' ⏸️ ' + tB.name : '') + ' 🔀';

    var dA = document.createElement('div');

// ─── Tabs: mouse wheel horizontal scroll + drag scroll ───
(function() {
  var tabsEl = document.getElementById('catTabs');
  if (!tabsEl) return;
  // Mouse wheel → horizontal scroll
  tabsEl.addEventListener('wheel', function(e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      tabsEl.scrollLeft += e.deltaY;
    }
  }, { passive: false });
  // Drag to scroll
  var isDown = false, startX, scrollLeft;
  tabsEl.addEventListener('mousedown', function(e) {
    if (e.target.closest('.cat-tab')) return; // don't drag when clicking tab
    isDown = true;
    tabsEl.style.cursor = 'grabbing';
    startX = e.pageX - tabsEl.offsetLeft;
    scrollLeft = tabsEl.scrollLeft;
  });
  tabsEl.addEventListener('mouseleave', function() { isDown = false; tabsEl.style.cursor = ''; });
  tabsEl.addEventListener('mouseup', function() { isDown = false; tabsEl.style.cursor = ''; });
  tabsEl.addEventListener('mousemove', function(e) {
    if (!isDown) return;
    e.preventDefault();
    var x = e.pageX - tabsEl.offsetLeft;
    tabsEl.scrollLeft = scrollLeft - (x - startX);
  });
})();

function initTour() {
  var seen = lsGet('tour_seen', false);
  if (seen) { initDiscovery(); return; }
  var steps = ['tour_welcome','tour_step1','tour_step2','tour_step3','tour_step4','tour_step5'];
  var stepIdx = 0;
  var overlay = document.createElement('div');
  overlay.id = '__tourOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center';
  function showStep() {
    overlay.innerHTML = '<div style="background:var(--card,#1a1d2b);border-radius:20px;padding:32px 24px;max-width:360px;text-align:center;color:var(--text,#e8eaed);animation:pageSlide .3s ease">'+
      '<div style="font-size:1.3rem;font-weight:800;margin-bottom:12px">' + _tr(steps[stepIdx]) + '</div>'+
      '<div style="font-size:.8rem;color:var(--text2,#8b90a5);margin-bottom:20px">' + (stepIdx+1) + ' / ' + steps.length + '</div>'+
      '<button class="btn btn-primary" id="__tourNext" style="width:100%">' + (stepIdx < steps.length-1 ? '▶ ادامه' : _tr('tour_done')) + '</button>'+
      '<button class="btn" id="__tourSkip" style="width:100%;margin-top:8px;font-size:.75rem">' + _tr('tour_done') + '</button>'+
    '</div>';
    overlay.querySelector('#__tourNext').onclick = function() { stepIdx++; if (stepIdx >= steps.length) { finishTour(); } else { showStep(); } };
    overlay.querySelector('#__tourSkip').onclick = finishTour;
  }
  function finishTour() { lsSet('tour_seen', true); overlay.remove(); initDiscovery(); }
  showStep();
  document.body.appendChild(overlay);
}

function initDiscovery() {
  var today = new Date().toDateString();
  var lastDiscovery = lsGet('discovery_date', '');
  if (lastDiscovery === today) return;
  lsSet('discovery_date', today);
  var allTools = Array.from(tools.values());
  var picks = [];
  while (picks.length < 3 && picks.length < allTools.length) {
    var rand = allTools[Math.floor(Math.random() * allTools.length)];
    if (picks.indexOf(rand) < 0) picks.push(rand);
  }
  if (picks.length === 0) return;
  setTimeout(function() {
    var toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9997;background:var(--card,#1a1d2b);border:2px solid var(--accent,#6c5ce7);border-radius:16px;padding:16px 20px;max-width:380px;width:90vw;box-shadow:0 8px 32px rgba(108,92,231,.3);animation:pageSlide .3s ease';
    toast.innerHTML = '<div style="font-weight:800;font-size:.9rem;color:var(--accent,#6c5ce7);margin-bottom:10px">' + _tr('discover') + '</div><div style="font-size:.75rem;color:var(--text2,#8b90a5);margin-bottom:10px">' + _tr('discover_desc') + '</div>' +
      picks.map(function(t) {
        return '<div style="display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;background:var(--glass,rgba(255,255,255,.04));border-radius:8px;cursor:pointer;font-size:.82rem" onclick="navigate(\''+t.id+'\');this.parentElement.parentElement.remove()"><span style="font-size:1.2rem">'+t.icon+'</span><span style="font-weight:600">'+_toolName(t)+'</span></div>';
      }).join('') +
      '<button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:.7rem" onclick="this.parentElement.parentElement.remove()">✕ ' + _tr('tour_done') + '</button>';
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 15000);
  }, 2000);
}

registerTool({

      var res=c.querySelector('#sl-result'); if (gross<=0) { res.classList.remove('show'); return; }
      var insurance = gross * insPct;

      var taxable = Math.max(0, afterIns - exempt);
      var tax = taxable * taxPct;
      var net = afterIns - tax;
      res.innerHTML = '<div class="loan-summary"><div class="loan-box"><div class="num">'+Math.round(net).toLocaleString('fa-IR')+'</div><div class="lbl">💰 خالص دریافتی</div></div><div class="loan-box"><div class="num" style="color:var(--danger)">'+Math.round(insurance+tax).toLocaleString('fa-IR')+'</div><div class="lbl">📉 کل کسورات</div></div><div class="loan-box"><div class="num">'+Math.round(insurance).toLocaleString('fa-IR')+'</div><div class="lbl">🏥 بیمه</div></div><div class="loan-box"><div class="num">'+Math.round(tax).toLocaleString('fa-IR')+'</div><div class="lbl">📋 مالیات</div></div></div>'+

        '<div class="row"><span class="label">مالیات ('+(taxPct*100)+'%):</span><span class="value" style="color:var(--danger)">- '+Math.round(tax).toLocaleString('fa-IR')+'</span></div>'+
        '<div class="row" style="border-top:2px solid var(--accent);padding-top:8px"><span class="label">💎 حقوق خالص:</span><span class="value" style="font-size:1.2rem;color:var(--success)">'+Math.round(net).toLocaleString('fa-IR')+' تومان</span></div>';
      res.classList.add('show');

});

// ─── Interest Rate Converter ───
registerTool({
  id: 'fin-rateconv',
  name: 'تبدیل نرخ بهره', name_en: 'Interest Rate Converter',
  icon: '🔄',
  category: 'financial', keywords: ['نرخ','بهره','rate','interest','سالانه','ماهانه','روزانه'],
  desc: 'تبدیل نرخ بهره سالانه، ماهانه و روزانه', desc_en: 'Convert between annual, monthly, and daily interest rates',
  render: function(c) {
    c.innerHTML = '<div class="card"><div class="inline-inputs"><div class="input-group"><label>نرخ (%):</label><input type="number" id="ir-val" value="24" step="any" style="direction:ltr;text-align:right;font-size:1.1rem"></div><div class="input-group"><label>از:</label><select id="ir-from"><option value="annual">سالانه</option><option value="monthly">ماهانه</option><option value="daily">روزانه</option></select></div></div><div id="ir-result" style="margin-top:10px;display:grid;gap:8px"><div class="row"><span class="label">📅 سالانه مؤثر:</span><span class="value" id="ir-annual">—</span></div><div class="row"><span class="label">📆 ماهانه:</span><span class="value" id="ir-monthly">—</span></div><div class="row"><span class="label">☀️ روزانه:</span><span class="value" id="ir-daily">—</span></div><div class="row"><span class="label">🔄 پیوسته:</span><span class="value" id="ir-cont">—</span></div></div></div>';
    function calc() {
      var v = parseFloat(c.querySelector('#ir-val').value)||0;
      var from = c.querySelector('#ir-from').value;
      var annual;
      if (from==='annual') annual=v/100;
      else if (from==='monthly') annual=Math.pow(1+v/1200,12)-1;
      else annual=Math.pow(1+v/36500,365)-1;
      var monthly=Math.pow(1+annual,1/12)-1;
      var daily=Math.pow(1+annual,1/365)-1;
      var continuous=Math.log(1+annual);
      c.querySelector('#ir-annual').textContent='% '+(annual*100).toFixed(4);
      c.querySelector('#ir-monthly').textContent='% '+(monthly*100).toFixed(4);
      c.querySelector('#ir-daily').textContent='% '+(daily*100).toFixed(4);
      c.querySelector('#ir-cont').textContent='% '+(continuous*100).toFixed(4);
    }
    c.querySelector('#ir-val').oninput=calc;
    c.querySelector('#ir-from').onchange=calc;
    calc();
  }
});

  <script>
    // ─── Service Worker with Auto-Update Notification ───
    if ('serviceWorker' in navigator) {
      var _swUpdateReady = false;
      var _swUpdateToast = null;
      var _swRegistration = null;

      // Create a persistent update banner
      function showUpdateBanner() {
        if (_swUpdateToast) return;
        _swUpdateToast = document.createElement('div');
        _swUpdateToast.id = '__swUpdateBanner';
        _swUpdateToast.innerHTML = `
          <div style="
            position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9999;
            background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:14px 24px;
            border-radius:20px;box-shadow:0 8px 32px rgba(108,92,231,.4);
            font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:12px;
            white-space:nowrap;cursor:pointer;animation:pageSlide .3s ease;
            max-width:90vw;flex-wrap:wrap;justify-content:center;
          " onclick="window.__applyUpdate()">
            <span>🔄</span>
            <span>نسخه جدید آماده است!</span>
            <span style="background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.75rem">بروزرسانی</span>
          </div>
        `;
        document.body.appendChild(_swUpdateToast);
      }

      // Apply update: tell SW to skip waiting, then reload
      window.__applyUpdate = function() {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
          // Remove old caches through the active SW
          if (window.caches) {
            window.caches.keys().then(function(names) {
              names.forEach(function(name) {
                if (name.indexOf('v1.0') === 0 || name.indexOf('v1.1') === 0 ||
                    name.indexOf('toolbox-runtime-v1') === 0 || name.indexOf('toolbox-runtime-v2') === 0) {
                  window.caches.delete(name);
                }
              });
            });
          }
        }
        // Force reload after a brief delay for SW activation
        setTimeout(function() {
          window.location.reload();
        }, 300);
      };

      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js').then(function(registration) {
          _swRegistration = registration;
          console.log('[SW] Registered:', registration.scope);

          // Listen for update messages from the SW
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_UPDATED') {
              console.log('[SW] New version available:', event.data.version);
              _swUpdateReady = true;
              showUpdateBanner();
            }
          });

          // Check for updates periodically
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] Update found and installed');
                _swUpdateReady = true;
                showUpdateBanner();
              }
            });
          });

          // Check for updates every 10 minutes
          setInterval(function() {
            registration.update().catch(function() {});
          }, 600000);

        }).catch(function(err) {
          console.warn('[SW] Registration failed:', err);
        });
      });

      // Handle controller change (after skipWaiting)
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        console.log('[SW] Controller changed — new SW active');
      });

      // ─── Enhanced Notification API (daily reminder, update alerts) ───
      var _notifGranted = false, _notifRequested = false;
      function requestNotifPermission() {
        if (_notifRequested) return; _notifRequested = true;
        if (!('Notification' in window)) return;
        Notification.requestPermission().then(function(perm) {
          if (perm === 'granted') { _notifGranted = true; scheduleDailyReminder(); scheduleUpdateCheck(); }
        }).catch(function() {});
      }
      function sendNotification(title, body) {
        if (!_notifGranted && Notification.permission !== 'granted') return;
        try { new Notification(title, { body: body, icon: './icons/icon-192.png', badge: './icons/icon-96.png', tag: 'toolbox', requireInteraction: false, vibrate: [200,100,200] }); } catch(e) {}
      }
      function scheduleDailyReminder() {
        var lastReminder = lsGet('last_reminder_date', '');
        var today = new Date().toDateString();
        if (lastReminder === today) return;
        lsSet('last_reminder_date', today);
        var allTools = Array.from(tools.values());
        var pick = allTools[Math.floor(Math.random()*allTools.length)];
        if (pick) {
          setTimeout(function() { sendNotification('🧰 '+_toolName(pick), 'امروز این ابزار رو امتحان کن! '+(pick.desc_en||pick.desc||'')); }, 3600000);
        }
      }
      function scheduleUpdateCheck() {
        setInterval(function() {
          if (_swRegistration) _swRegistration.update().catch(function() {});
        }, 3600000);
      }
      // Auto-notify on version change
      var _lastVersion = lsGet('app_version', '1.2.0');
      if (_lastVersion !== '1.2.1') {
        lsSet('app_version', '1.2.1');
        setTimeout(function() { sendNotification('🧰 نسخه 1.2.1', 'ابزارهای جدید: مقایسه همزمان، مبدل‌های فشار/انرژی/زاویه/زمان/شتاب، نوتیفیکیشن روزانه'); }, 5000);
      }
      if (Notification.permission === 'granted') { _notifGranted = true; scheduleDailyReminder(); scheduleUpdateCheck(); }
      else if (Notification.permission === 'default') {
        document.addEventListener('click', requestNotifPermission, { once: true });
        document.addEventListener('touchstart', requestNotifPermission, { once: true });
        setTimeout(requestNotifPermission, 30000);
      }

      // ─── Background Sync ───
      if (_swRegistration && 'SyncManager' in window) {
        _swRegistration.sync.register('sync-toolbox').catch(function(err) {
          console.log('[Sync] Background sync not available:', err);
        });
      }

      // ─── Tool State Persistence (through SW IndexedDB) ───
      window.__saveToolState = function(toolId, state) {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SAVE_STATE', toolId: toolId, state: state });
        }
        // Fallback: save to main IndexedDB
        if (toolId && state) {
          try { dbPut('kv', 'state_' + toolId, JSON.stringify(state)).catch(function() {}); } catch(e) {}
        }
      };

      window.__loadToolState = function(toolId, callback) {
        // Try SW IndexedDB first
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          var channel = new MessageChannel();
          channel.port1.onmessage = function(event) {
            if (event.data && event.data.state) {
              callback(event.data.state);
            } else {
              // Fallback to main DB
              dbGet('kv', 'state_' + toolId).then(function(v) {
                callback(v ? JSON.parse(v) : null);
              }).catch(function() { callback(null); });
            }
          };
          navigator.serviceWorker.controller.postMessage({ type: 'GET_STATE', toolId: toolId }, [channel.port2]);
          // Timeout fallback
          setTimeout(function() { callback(null); }, 2000);
        } else {
          dbGet('kv', 'state_' + toolId).then(function(v) {
            callback(v ? JSON.parse(v) : null);
          }).catch(function() { callback(null); });
        }
      };
    }
  </script>
