  const resultDiv = container.querySelector('#cal-result');

  function renderSuggestions(query) {
    const filtered = query ? FOODS.filter(f => f.name.includes(query)) : FOODS.slice(0, 10);
    sugDiv.innerHTML = filtered.map((f, i) => {
      const idx = FOODS.indexOf(f);
      return `<div data-idx="${idx}" style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s;font-size:.85rem">${f.name} — ${f.cal} kcal/100g</div>`;
    }).join('') || '<div style="text-align:center;color:var(--text2);padding:8px">غذایی یافت نشد</div>';

    sugDiv.querySelectorAll('[data-idx]').forEach(el => {
      el.addEventListener('click', () => {
        const food = FOODS[parseInt(el.dataset.idx)];
        const amount = parseFloat(container.querySelector('#cal-amount').value) || 100;
        selectedFoods.push({ ...food, amount });
        renderSelected();
        searchInput.value = '';
        sugDiv.innerHTML = '';
      });
    });
  }

  function renderSelected() {
    selDiv.innerHTML = selectedFoods.map((sf, i) =>
      `<span style="display:inline-block;background:var(--glass2);padding:4px 10px;border-radius:16px;margin:3px;font-size:13px;border:1px solid var(--border)">${sf.name} (${sf.amount}g) <span data-ridx="${i}" style="cursor:pointer;color:var(--danger);margin-right:4px">✕</span></span>`
    ).join('');

    selDiv.querySelectorAll('[data-ridx]').forEach(el => {
      el.addEventListener('click', () => {
        selectedFoods.splice(parseInt(el.dataset.ridx), 1);
        renderSelected();
      });
    });
  }

  searchInput.addEventListener('input', (e) => renderSuggestions(e.target.value));
  renderSuggestions('');

  container.querySelector('#cal-calc').addEventListener('click', () => {
    if (!selectedFoods.length) { showToast('حداقل یک غذا انتخاب کنید'); return; }

    let totalCal = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
    selectedFoods.forEach(sf => {
      const ratio = sf.amount / 100;
      totalCal += sf.cal * ratio;
      totalProtein += sf.protein * ratio;
      totalCarbs += sf.carbs * ratio;
      totalFat += sf.fat * ratio;
    });

    const resultBox = container.querySelector('#cal-result');
    resultBox.innerHTML = `
      <div style="text-align:center;padding:8px 0">
        <div style="font-size:2.4rem;font-weight:900;color:var(--accent)">${Math.round(totalCal).toLocaleString('fa-IR')}</div>
        <div style="font-size:.85rem;color:var(--text2)">کیلوکالری</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
        <div style="text-align:center;padding:8px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1.1rem;font-weight:900;color:#3498db">${totalProtein.toFixed(1)}g</div>
          <div style="font-size:.65rem;color:var(--text2)">پروتئین</div>
        </div>
        <div style="text-align:center;padding:8px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1.1rem;font-weight:900;color:#f39c12">${totalCarbs.toFixed(1)}g</div>
          <div style="font-size:.65rem;color:var(--text2)">کربوهیدرات</div>
        </div>
        <div style="text-align:center;padding:8px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1.1rem;font-weight:900;color:#e74c3c">${totalFat.toFixed(1)}g</div>
          <div style="font-size:.65rem;color:var(--text2)">چربی</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">اقلام:</div>
        ${selectedFoods.map(sf => `<div style="font-size:.8rem;padding:2px 0">${sf.name} — ${sf.amount}g — ${Math.round(sf.cal * sf.amount / 100)} kcal</div>`).join('')}
      </div>
    `;
    resultBox.style.display = 'block';
  });
}

/* ─── health-heartbeat ─── */
function renderHeartbeat(container) {
  container.innerHTML = `
    <div style="text-align:center">
      <div id="hb-bpm" style="font-size:3rem;font-weight:900;color:var(--danger)">--</div>
      <div style="font-size:.75rem;color:var(--text2);margin-bottom:12px">BPM</div>
      <div style="text-align:center;margin:12px 0">
        <button class="btn" id="hb-tap" style="font-size:20px;padding:16px 32px;border-radius:50%;width:120px;height:120px">❤️<br>ضربه</button>
      </div>
      <div style="text-align:center;margin:8px 0">
        <button class="btn btn-ghost" id="hb-reset" style="font-size:13px">🔄 ریست</button>
      </div>
      <div id="hb-info" style="margin-top:12px;font-size:13px;color:var(--text2);text-align:center">۱۵ ثانیه ضربه بزنید تا ضربان قلب محاسبه شود</div>
      <div id="hb-result" style="display:none;margin-top:12px;padding:14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius)"></div>
    </div>
  `;

  let taps = [];
  const bpmDiv = container.querySelector('#hb-bpm');
  const infoDiv = container.querySelector('#hb-info');
  const resultDiv = container.querySelector('#hb-result');

  container.querySelector('#hb-tap').addEventListener('click', () => {
    const now = Date.now();
    taps.push(now);
    taps = taps.filter(t => now - t < 15000);

    if (taps.length < 2) {
      infoDiv.textContent = `ضربه ${taps.length} — ادامه دهید...`;
      return;
    }

    const elapsed = (taps[taps.length - 1] - taps[0]) / 1000;
    const bpm = Math.round(((taps.length - 1) / elapsed) * 60);
    bpmDiv.textContent = bpm;

    // Determine zone
    const age = 30; // default age
    const maxHR = 220 - age;
    const zones = [
      { name: 'استراحت', min: 0, max: Math.round(maxHR * 0.5), color: '#3498db' },
      { name: 'چربیسوزی', min: Math.round(maxHR * 0.5), max: Math.round(maxHR * 0.7), color: '#2ecc71' },
      { name: 'قلبیعروقی', min: Math.round(maxHR * 0.7), max: Math.round(maxHR * 0.85), color: '#f39c12' },
      { name: 'اوج', min: Math.round(maxHR * 0.85), max: maxHR, color: '#e74c3c' },
    ];
    const zone = zones.find(z => bpm >= z.min && bpm < z.max) || zones[zones.length - 1];

    infoDiv.innerHTML = `
      <div style="padding:8px;border-radius:8px;background:${zone.color}22;border:1px solid ${zone.color};color:${zone.color};font-weight:700;margin-bottom:8px">ناحیه: ${zone.name}</div>
      <div style="display:flex;gap:4px;justify-content:center">
        ${zones.map(z => `<div style="flex:1;padding:4px;border-radius:4px;background:${z.color}22;text-align:center;font-size:10px;${bpm >= z.min && bpm < z.max ? 'border:2px solid ' + z.color : ''}"><div style="color:${z.color};font-weight:700">${z.name}</div><div>${z.min}-${z.max}</div></div>`).join('')}
      </div>
    `;
  });

  container.querySelector('#hb-reset').addEventListener('click', () => {
    taps = [];
    bpmDiv.textContent = '--';
    infoDiv.textContent = '۱۵ ثانیه ضربه بزنید تا ضربان قلب محاسبه شود';
    resultDiv.style.display = 'none';
  });
}

/* ─── health-bmi ─── */
function renderHealthBmi(container) {
  container.innerHTML = `
    <div class="input-group">
      <label>وزن (کیلوگرم):</label>
      <input type="number" id="hbmi-weight" placeholder="مثال: 70" min="1">
    </div>
    <div class="input-group">
      <label>قد (سانتیمتر):</label>
      <input type="number" id="hbmi-height" placeholder="مثال: 175" min="1">
    </div>
    <div class="input-group">
      <label>سن:</label>
      <input type="number" id="hbmi-age" placeholder="مثال: 30" min="1" max="120">
    </div>
    <div class="input-group">
      <label>جنسیت:</label>
      <select id="hbmi-gender">
        <option value="male">مرد</option>
        <option value="female">زن</option>
      </select>
    </div>
    <button class="btn btn-primary" id="hbmi-calc" style="width:100%;margin-top:8px">محاسبه</button>
    <div id="hbmi-result" style="display:none;margin-top:12px;padding:14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius)"></div>
  `;

  container.querySelector('#hbmi-calc').addEventListener('click', () => {
    const w = parseFloat(container.querySelector('#hbmi-weight').value);
    const h = parseFloat(container.querySelector('#hbmi-height').value);
    const age = parseInt(container.querySelector('#hbmi-age').value) || 30;
    const gender = container.querySelector('#hbmi-gender').value;

    if (!w || !h || w <= 0 || h <= 0) { showToast('وزن و قد را وارد کنید'); return; }

    const hm = h / 100;
    const bmi = w / (hm * hm);

    let category, catColor;
    if (bmi < 18.5) { category = 'کمبود وزن'; catColor = '#3498db'; }
    else if (bmi < 25) { category = 'وزن نرمال'; catColor = '#2ecc71'; }
    else if (bmi < 30) { category = 'اضافه وزن'; catColor = '#f39c12'; }
    else { category = 'چاق'; catColor = '#e74c3c'; }

    // Ideal weight range
    const idealMin = (18.5 * hm * hm).toFixed(1);
    const idealMax = (25 * hm * hm).toFixed(1);

    // BMR (Mifflin-St Jeor)
    let bmr;
    if (gender === 'male') bmr = 10 * w + 6.25 * h - 5 * age + 5;
    else bmr = 10 * w + 6.25 * h - 5 * age - 161;

    // Daily calories
    const sedentary = Math.round(bmr * 1.2);
    const moderate = Math.round(bmr * 1.55);
    const active = Math.round(bmr * 1.725);

    const resultBox = container.querySelector('#hbmi-result');
    resultBox.innerHTML = `
      <div style="text-align:center;padding:8px 0">
        <div style="font-size:2.4rem;font-weight:900;color:${catColor}">${bmi.toFixed(1)}</div>
        <div style="margin-top:6px"><span style="display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:600;background:${catColor}22;color:${catColor};border:1px solid ${catColor}">${category}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div style="text-align:center;padding:10px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1rem;font-weight:900;color:var(--accent)">${idealMin} - ${idealMax}</div>
          <div style="font-size:.65rem;color:var(--text2)">وزن ایده‌آل (kg)</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1rem;font-weight:900;color:var(--accent)">${Math.round(bmr)}</div>
          <div style="font-size:.65rem;color:var(--text2)">متابولیسم پایه (BMR)</div>
        </div>
      </div>
      <div style="margin-top:12px;font-size:.75rem;color:var(--text2)">
        <div style="font-weight:700;margin-bottom:4px">کالری روزانه مورد نیاز:</div>
        <div>🪑 کم‌تحرک: <strong>${sedentary.toLocaleString('fa-IR')}</strong> kcal</div>
        <div>🚶 متوسط: <strong>${moderate.toLocaleString('fa-IR')}</strong> kcal</div>
        <div>🏃 فعال: <strong>${active.toLocaleString('fa-IR')}</strong> kcal</div>
      </div>
      <div style="margin-top:12px">
        <div style="font-size:.65rem;color:var(--text2);margin-bottom:4px">محدوده BMI:</div>
        <div style="position:relative;height:24px;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#3498db 0%,#2ecc71 30%,#f1c40f 55%,#e74c3c 80%,#8e44ad 100%)">
          <div style="position:absolute;top:-2px;width:4px;height:28px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .5s;left:${Math.min(Math.max((bmi - 10) / 35, 0), 1) * 100}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.55rem;color:var(--text2);margin-top:4px">
          <span>کمبود</span><span>نرمال</span><span>اضافه</span><span>چاق</span>
        </div>
      </div>
    `;
    resultBox.style.display = 'block';
  });
}

      <label>قد پدر (سانتیمتر):</label>
      <input type="number" id="ch-father" placeholder="مثال: 175" min="130" max="230">
    </div>
    <div class="input-group">
      <label>قد مادر (سانتیمتر):</label>
      <input type="number" id="ch-mother" placeholder="مثال: 162" min="130" max="230">
    </div>
    <button class="btn btn-primary" id="ch-calc" style="width:100%;margin-top:8px">محاسبه</button>
    <div id="ch-result" style="display:none;margin-top:12px;padding:14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius)"></div>
  `;

  container.querySelector('#ch-calc').addEventListener('click', () => {
    const gender = container.querySelector('#ch-gender').value;
    const age = parseFloat(container.querySelector('#ch-age').value);
    const height = parseFloat(container.querySelector('#ch-height').value);
    const father = parseFloat(container.querySelector('#ch-father').value);
    const mother = parseFloat(container.querySelector('#ch-mother').value);

    if (!age || !height || !father || !mother) { showToast('همه فیلدها را پر کنید'); return; }

    // Mid-parental method
    let midParental;
    if (gender === 'male') midParental = ((father + mother + 13) / 2);
    else midParental = ((father + mother - 13) / 2);

    // Growth percentile estimation
    const growthRemaining = gender === 'male'
      ? (18 - age) * 6.5  // boys grow ~6.5cm/year after puberty
      : (16 - age) * 5.5;  // girls grow ~5.5cm/year

    const estimatedHeight = Math.min(midParental, height + Math.max(growthRemaining, 0));
    const heightRange = [Math.round(estimatedHeight - 5), Math.round(estimatedHeight + 5)];

    const resultBox = container.querySelector('#ch-result');
    resultBox.innerHTML = `
      <div style="text-align:center;padding:8px 0">
        <div style="font-size:2.4rem;font-weight:900;color:var(--accent)">${Math.round(estimatedHeight)}</div>
        <div style="font-size:.85rem;color:var(--text2)">سانتیمتر (قد تقریبی بزرگسالی)</div>
        <div style="font-size:1rem;font-weight:700;margin-top:8px">محدوده: ${heightRange[0]} - ${heightRange[1]} cm</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div style="text-align:center;padding:10px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1rem;font-weight:900;color:var(--accent)">${Math.round(midParental)}</div>
          <div style="font-size:.65rem;color:var(--text2)">میانگین والدین</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--glass2);border-radius:8px">
          <div style="font-size:1rem;font-weight:900;color:var(--accent)">${Math.round(height + Math.max(growthRemaining, 0))}</div>
          <div style="font-size:.65rem;color:var(--text2)">بر اساس رشد فعلی</div>
        </div>
      </div>
      <div style="margin-top:12px;font-size:.75rem;color:var(--text2);text-align:center">
        ⚠️ این تخمین بر اساس فرمول Mid-Parental است و ممکن است دقیق نباشد.
      </div>
    `;
    resultBox.style.display = 'block';
  });
}

function renderBodyFat(container) {
  container.innerHTML = `

        </div>
        <div class="input-group">
          <label>قد (cm):</label>

        </div>
      </div>
      <div class="inline-inputs">
        <div class="input-group">

        </div>
        <div class="input-group">
          <label>دور کمر (cm):</label>

        </div>
      </div>
      <div class="input-group" id="bf-hip-group" style="display:none">
        <label>دور باسن (cm):</label>
        <input type="number" id="bf-hip" value="95" step="0.1" style="direction:ltr;text-align:right">
      </div>
      <button class="btn btn-primary" id="bf-calc" style="width:100%">📏 محاسبه</button>
      <div id="bf-result" class="result"></div>
    </div>
  `;
  var el = container;
  el.querySelector('#bf-gender').onchange = function() {
    el.querySelector('#bf-hip-group').style.display = this.value === 'female' ? 'block' : 'none';
  };
  function calc() {
    var gender = el.querySelector('#bf-gender').value;
    var weight = parseFloat(el.querySelector('#bf-weight').value) || 0;
    var height = parseFloat(el.querySelector('#bf-height').value) || 0;
    var neck = parseFloat(el.querySelector('#bf-neck').value) || 0;
    var waist = parseFloat(el.querySelector('#bf-waist').value) || 0;
    var hip = parseFloat(el.querySelector('#bf-hip').value) || 0;
    var result = el.querySelector('#bf-result');
    if (weight <= 0 || height <= 0 || neck <= 0 || waist <= 0) { result.classList.remove('show'); return; }
    var bf;
    if (gender === 'male') {
      bf = 86.010 * Math.log10(waist - neck) - 70.041 * Math.log10(height) + 36.76;
    } else {
      if (hip <= 0) { showToast('لطفاً دور باسن را وارد کنید'); return; }
      bf = 163.205 * Math.log10(waist + hip - neck) - 97.684 * Math.log10(height) - 78.387;
    }
    bf = Math.max(2, Math.min(50, Math.round(bf * 10) / 10));
    var fatMass = weight * bf / 100;
    var leanMass = weight - fatMass;
    var category;
    if (gender === 'male') {
      if (bf < 6) category = 'چربی ضروری (Essential)';
      else if (bf < 14) category = 'ورزشکار (Athlete)';
      else if (bf < 18) category = 'مناسب (Fitness)';
      else if (bf < 25) category = 'متوسط (Average)';
      else category = 'بالا (Obese)';
    } else {
      if (bf < 14) category = 'چربی ضروری (Essential)';
      else if (bf < 21) category = 'ورزشکار (Athlete)';
      else if (bf < 25) category = 'مناسب (Fitness)';
      else if (bf < 32) category = 'متوسط (Average)';
      else category = 'بالا (Obese)';
    }
    result.innerHTML = `
      <div class="row" style="border-bottom:2px solid var(--accent);padding-bottom:8px">
        <span class="label">📏 درصد چربی بدن:</span>
        <span class="value" style="font-size:1.2rem;color:var(--accent)">% ${bf.toFixed(1)}</span>
      </div>
      <div class="row"><span class="label">⚖️ توده چربی:</span><span class="value">${fatMass.toFixed(1)} kg</span></div>
      <div class="row"><span class="label">💪 توده بدون چربی:</span><span class="value">${leanMass.toFixed(1)} kg</span></div>
      <div class="row"><span class="label">🏷️ دسته‌بندی:</span><span class="value" style="color:${bf < 25 ? 'var(--success)' : 'var(--danger)'}">${category}</span></div>
      <div style="margin-top:8px;background:var(--glass);border-radius:8px;overflow:hidden;height:8px">
        <div style="width:${Math.min(100, bf*2)}%;height:100%;background:linear-gradient(90deg,#00b894,#fdcb6e,#e17055);border-radius:8px"></div>
      </div>
    `;
    result.classList.add('show');
  }
  el.querySelector('#bf-calc').onclick = calc;
}

// ─── HIIT 7-Minute Timer ───
function renderHiit(container) {
  var exercises = [
    { name: 'پرش پروانه', icon: '🤸' },
    { name: 'اسکات با دیوار', icon: '🪑' },
    { name: 'شنا', icon: '💪' },
    { name: 'دراز نشست', icon: '🔄' },
    { name: 'گام بلند', icon: '🚶' },
    { name: 'پلانک', icon: '📏' },
    { name: 'زانو بلند', icon: '🏃' },
    { name: 'لانج', icon: '🦵' },
    { name: 'شنا معکوس', icon: '🔙' },
    { name: 'پلانک پهلو (راست)', icon: '↗️' },
    { name: 'پلانک پهلو (چپ)', icon: '↖️' },
    { name: 'حرکت کوهنورد', icon: '⛰️' },
  ];
  var workSec = 30, restSec = 10, totalRounds = 12;
  var currentRound = 0, phase = 'ready', timeLeft = 0, interval = null, running = false;

  function beep(freq, dur) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator(); var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq || 880; gain.gain.value = 0.3;
      osc.start(); osc.stop(ctx.currentTime + (dur || 0.2));
      setTimeout(function() { ctx.close(); }, (dur || 0.2) * 1000 + 200);
    } catch(e) {}
  }

  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  function start() {
    if (phase === 'ready' || phase === 'done') { currentRound = 1; phase = 'work'; timeLeft = workSec; beep(880, 0.3); }
    running = true;
    interval = setInterval(function() {
      timeLeft--;
      if (timeLeft <= 0) {
        if (phase === 'work') {
          beep(1200, 0.3);
          if (currentRound >= totalRounds) { phase = 'done'; running = false; clearInterval(interval); beep(660, 0.1); setTimeout(function() { beep(880, 0.1); }, 150); setTimeout(function() { beep(1200, 0.3); }, 300); renderUI(); return; }
          phase = 'rest'; timeLeft = restSec;
        } else if (phase === 'rest') {
          beep(880, 0.15); setTimeout(function() { beep(1200, 0.15); }, 200);
          currentRound++; phase = 'work'; timeLeft = workSec;
        }
      }
      var display = container.querySelector('#hiit-display');
      var roundEl = container.querySelector('#hiit-round');
      var phaseEl = container.querySelector('#hiit-phase');
      if (display) display.textContent = fmt(timeLeft);
      if (roundEl) roundEl.textContent = currentRound + ' / ' + totalRounds;
      if (phaseEl) {
        if (phase === 'work') { phaseEl.textContent = exercises[currentRound-1] ? exercises[currentRound-1].icon + ' ' + exercises[currentRound-1].name : 'تمرین'; phaseEl.style.color = '#e17055'; }
        else if (phase === 'rest') { phaseEl.textContent = '😴 استراحت'; phaseEl.style.color = '#00b894'; }
        else { phaseEl.textContent = '🎉 تمام!'; phaseEl.style.color = '#ff9800'; }
      }
    }, 1000);
  }

  function pause() { running = false; clearInterval(interval); }
  function reset() { running = false; clearInterval(interval); phase = 'ready'; currentRound = 0; timeLeft = 0; renderUI(); }

  function renderUI() {
    var ex = exercises[currentRound - 1];
    var progressPct = totalRounds > 0 ? (currentRound - 1 + (phase === 'rest' ? 0.5 : 0)) / totalRounds * 100 : 0;
    container.innerHTML = `
      <div class="card" style="text-align:center">
        <div id="hiit-display" style="font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;padding:16px 0">${phase === 'ready' ? fmt(workSec) : phase === 'done' ? '🎉' : fmt(timeLeft)}</div>
        <div id="hiit-phase" style="font-size:1.3rem;font-weight:700;min-height:36px;margin:4px 0">${phase === 'ready' ? '⏱ آماده شروع' : phase === 'done' ? '🎉 تمرین تمام شد! آفرین 👏' : phase === 'work' && ex ? ex.icon + ' ' + ex.name : '😴 استراحت'}</div>
        <div id="hiit-round" style="font-size:.85rem;color:var(--text2);margin:4px 0">${phase === 'ready' ? '۱۲ حرکت × ۳۰s / استراحت ۱۰s' : currentRound + ' / ' + totalRounds}</div>
        <div style="background:var(--border);border-radius:8px;height:8px;overflow:hidden;margin:12px 0">
          <div style="width:${progressPct}%;height:100%;background:linear-gradient(90deg,#e17055,#fdcb6e,#00b894);border-radius:8px;transition:width 0.3s"></div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn btn-primary" id="hiit-start" style="font-size:1.1rem;padding:12px 32px">${running ? '⏸ مکث' : phase === 'ready' ? '▶ شروع' : phase === 'done' ? '🔄 شروع مجدد' : '▶ ادامه'}</button>
          <button class="btn" id="hiit-reset" style="padding:12px 20px;font-size:1.2rem">⟲</button>
        </div>
        <div style="margin-top:12px;font-size:.7rem;color:var(--text2)">⏱ کل: ۷ دقیقه | 🔥 ۳۰s کار / 😴 ۱۰s استراحت</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;font-size:.65rem;color:var(--text2)">
          ${exercises.map(function(e, i) { return '<div style="padding:4px;border-radius:6px;' + (i === currentRound - 1 && phase === 'work' ? 'background:var(--accent-glow);color:var(--accent);font-weight:700' : '') + '">' + e.icon + '<br>' + (i+1) + '</div>'; }).join('')}
        </div>
      </div>
    `;
    container.querySelector('#hiit-start').onclick = function() { if (running) pause(); else start(); renderUI(); };
    container.querySelector('#hiit-reset').onclick = function() { reset(); };
  }  renderUI();
}

    function pickCard() {
      for (var b = 0; b < 5; b++) { if (boxes[b].length > 0) { currentCard = boxes[b][0]; currentBox = b; return; } }
      currentCard = null; currentBox = -1;
    }
    function renderUI() {
      var counts = boxes.map(function(b) { return b.length; });
      var total = cards.length;
      container.innerHTML = '';
      var html = '<div class="card">';
      html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:.7rem;color:var(--text2)">';
      html += counts.map(function(c, i) { var cols = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db']; return '<span style="background:'+cols[i]+';color:#fff;padding:4px 8px;border-radius:8px">جعبه '+(i+1)+': '+c+'</span>'; }).join('');
      html += '<span style="margin-right:auto">📦 '+total+' کارت</span>';
      html += '</div>';
      if (currentCard) {
        html += '<div id="fc-card" style="background:var(--glass);border:2px solid var(--border);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;min-height:180px;display:flex;align-items:center;justify-content:center;user-select:none;transition:all .3s;font-size:1.5rem;font-weight:700;direction:ltr">'+currentCard.front+'</div>';
        html += '<style>#fc-card.flipped{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent)}</style>';
        html += '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-success" id="fc-ok" style="flex:1">✅ بلد بودم</button><button class="btn btn-accent" id="fc-no" style="flex:1">❌ نشد</button></div>';
      } else {
        html += '<div style="text-align:center;padding:48px 20px;color:var(--text2)"><div style="font-size:3rem;margin-bottom:12px">🎉</div><p>همه کارت‌ها رو بلدی! کارت جدید اضافه کن.</p></div>';
      }
      html += '<div class="input-group" style="margin-top:12px"><label>اضافه کردن کارت جدید:</label><div class="inline-inputs"><input type="text" id="fc-front" placeholder="روی کارت (انگلیسی)" style="direction:ltr;text-align:left;flex:1"><input type="text" id="fc-back" placeholder="پشت کارت (فارسی)" style="direction:rtl;flex:1"><button class="btn btn-primary" id="fc-add" style="flex-shrink:0">➕</button></div></div>';
      html += '</div>';
      container.innerHTML = html;
      var cardEl = container.querySelector('#fc-card');
      if (cardEl) {
        cardEl.onclick = function() { this.classList.toggle('flipped'); this.textContent = this.classList.contains('flipped') ? (currentCard ? currentCard.back : '') : (currentCard ? currentCard.front : ''); };
      }
      var okBtn = container.querySelector('#fc-ok');
      var noBtn = container.querySelector('#fc-no');
      if (okBtn) okBtn.onclick = function() { answerCard(true); };
      if (noBtn) noBtn.onclick = function() { answerCard(false); };
      container.querySelector('#fc-add').onclick = function() {
        var f = container.querySelector('#fc-front').value.trim();
        var b = container.querySelector('#fc-back').value.trim();
        if (!f || !b) { showToast('هر دو فیلد را پر کنید'); return; }
        cards.push({ front: f, back: b }); boxes[0].push({ front: f, back: b });
        container.querySelector('#fc-front').value = ''; container.querySelector('#fc-back').value = '';
        pickCard(); save(); renderUI();
      };
    }
    function answerCard(knew) {
      if (!currentCard) return;
      boxes[currentBox].shift();
      if (knew) {
        var newBox = Math.min(currentBox + 1, 4); boxes[newBox].push(currentCard);
      } else {
        boxes[0].push(currentCard);
      }
      pickCard(); save(); renderUI();
    }
    load(function() { pickCard(); renderUI(); });
  }
});

// ─── Quadratic Equation Solver ───
registerTool({
  id: 'edu-quadratic',
  name: 'حل معادله درجه ۲',
  icon: '📐',
  category: 'new-tools',
  keywords: ['معادله', 'درجه۲', 'quadratic', 'دلتا', 'ریشه', 'ax2+bx+c', 'math'],
  desc: 'حل معادله درجه دوم (ax² + bx + c = 0) با محاسبه دلتا و ریشه‌ها',
  render: function(container) {
    container.innerHTML = '';
    var html = '<div class="card">';
    html += '<div style="text-align:center;font-size:1.3rem;font-weight:700;margin-bottom:12px;direction:ltr">ax² + bx + c = 0</div>';
    html += '<div class="inline-inputs"><div class="input-group"><label>a:</label><input type="number" id="qd-a" value="1" step="any" style="direction:ltr;text-align:right"></div><div class="input-group"><label>b:</label><input type="number" id="qd-b" value="-3" step="any" style="direction:ltr;text-align:right"></div><div class="input-group"><label>c:</label><input type="number" id="qd-c" value="2" step="any" style="direction:ltr;text-align:right"></div></div>';
    html += '<button class="btn btn-primary" id="qd-solve" style="width:100%">📐 حل معادله</button>';
    html += '<div id="qd-result" class="result"></div></div>';
    container.innerHTML = html;
    container.querySelector('#qd-solve').onclick = function() {
      var a = parseFloat(container.querySelector('#qd-a').value) || 0;
      var b = parseFloat(container.querySelector('#qd-b').value) || 0;
      var c = parseFloat(container.querySelector('#qd-c').value) || 0;
      var res = container.querySelector('#qd-result');
      if (a === 0) { res.innerHTML = '<div class="row"><span class="label">⚠️</span><span class="value" style="color:var(--danger)">a نباید صفر باشد (معادله خطی است)</span></div>'; res.classList.add('show'); return; }
      var delta = b*b - 4*a*c;
      var vertex = -b/(2*a);
      var sym = a > 0 ? '⌣' : '⌢';
      if (delta > 0) {
        var x1 = (-b + Math.sqrt(delta)) / (2*a); var x2 = (-b - Math.sqrt(delta)) / (2*a);
        res.innerHTML = '<div class="row" style="border-bottom:2px solid var(--accent);padding-bottom:8px"><span class="label">Δ (دلتا):</span><span class="value" style="color:var(--success)">'+delta.toFixed(4)+'</span></div><div class="row"><span class="label">📊 وضعیت:</span><span class="value" style="color:var(--success)">دو ریشه حقیقی</span></div><div class="row"><span class="label">x₁:</span><span class="value" style="font-size:1.2rem">'+x1.toFixed(4)+'</span></div><div class="row"><span class="label">x₂:</span><span class="value" style="font-size:1.2rem">'+x2.toFixed(4)+'</span></div><div class="row"><span class="label">رأس سهمی:</span><span class="value">('+vertex.toFixed(2)+', '+((-delta/(4*a)).toFixed(2))+') '+sym+'</span></div>';
      } else if (delta === 0) {
        res.innerHTML = '<div class="row" style="border-bottom:2px solid var(--accent);padding-bottom:8px"><span class="label">Δ (دلتا):</span><span class="value">۰</span></div><div class="row"><span class="label">📊 وضعیت:</span><span class="value" style="color:var(--warning)">ریشه مضاعف</span></div><div class="row"><span class="label">x:</span><span class="value" style="font-size:1.2rem">'+vertex.toFixed(4)+'</span></div>';
      } else {
        var real = (-b/(2*a)).toFixed(4); var imag = (Math.sqrt(-delta)/(2*a)).toFixed(4);
        res.innerHTML = '<div class="row" style="border-bottom:2px solid var(--accent);padding-bottom:8px"><span class="label">Δ (دلتا):</span><span class="value" style="color:var(--danger)">'+delta.toFixed(4)+'</span></div><div class="row"><span class="label">📊 وضعیت:</span><span class="value" style="color:var(--danger)">دو ریشه مختلط</span></div><div class="row"><span class="label">x₁:</span><span class="value" style="direction:ltr">'+real+' + '+imag+'i</span></div><div class="row"><span class="label">x₂:</span><span class="value" style="direction:ltr">'+real+' − '+imag+'i</span></div>';
      }
      res.classList.add('show');
    };
  }
});

// ─── Geometry Area & Volume ───
registerTool({
  id: 'edu-geometry',
  name: 'مساحت و حجم اشکال',
  icon: '📏',
  category: 'new-tools',
  keywords: ['مساحت', 'حجم', 'هندسه', 'area', 'volume', 'محیط', 'دایره', 'مربع', 'مثلث'],
  desc: 'محاسبه مساحت، محیط و حجم ۱۲ شکل هندسی رایج',
  render: function(container) {
    var shapes = [
      { id: 'square', name: 'مربع', icon: '⬛', params: [{ n: 'side', label: 'ضلع (a)' }], area: function(p) { return p.side*p.side; }, perimeter: function(p) { return 4*p.side; }, hasVolume: false },
      { id: 'rectangle', name: 'مستطیل', icon: '▬', params: [{ n: 'w', label: 'طول' }, { n: 'h', label: 'عرض' }], area: function(p) { return p.w*p.h; }, perimeter: function(p) { return 2*(p.w+p.h); }, hasVolume: false },
      { id: 'circle', name: 'دایره', icon: '⭕', params: [{ n: 'r', label: 'شعاع (r)' }], area: function(p) { return Math.PI*p.r*p.r; }, perimeter: function(p) { return 2*Math.PI*p.r; }, hasVolume: false },
      { id: 'triangle', name: 'مثلث', icon: '🔺', params: [{ n: 'base', label: 'قاعده' }, { n: 'height', label: 'ارتفاع' }], area: function(p) { return 0.5*p.base*p.height; }, hasVolume: false },
      { id: 'sphere', name: 'کره', icon: '🔵', params: [{ n: 'r', label: 'شعاع (r)' }], area: function(p) { return 4*Math.PI*p.r*p.r; }, volume: function(p) { return (4/3)*Math.PI*Math.pow(p.r,3); }, hasVolume: true },
      { id: 'cube', name: 'مکعب', icon: '🧊', params: [{ n: 'side', label: 'ضلع (a)' }], area: function(p) { return 6*p.side*p.side; }, volume: function(p) { return Math.pow(p.side,3); }, hasVolume: true },
      { id: 'cylinder', name: 'استوانه', icon: '🥫', params: [{ n: 'r', label: 'شعاع' }, { n: 'h', label: 'ارتفاع' }], area: function(p) { return 2*Math.PI*p.r*(p.r+p.h); }, volume: function(p) { return Math.PI*p.r*p.r*p.h; }, hasVolume: true },
      { id: 'cone', name: 'مخروط', icon: '🔺', params: [{ n: 'r', label: 'شعاع' }, { n: 'h', label: 'ارتفاع' }], area: function(p) { var s = Math.sqrt(p.r*p.r+p.h*p.h); return Math.PI*p.r*(p.r+s); }, volume: function(p) { return (1/3)*Math.PI*p.r*p.r*p.h; }, hasVolume: true },
    ];
    var current = shapes[0];
    function render() {
      container.innerHTML = '';
      var html = '<div class="card">';
      html += '<div class="input-group"><label>شکل:</label><select id="geo-shape">'+shapes.map(function(s,i) { return '<option value="'+i+'"'+(current.id===s.id?' selected':'')+'>'+s.icon+' '+s.name+'</option>'; }).join('')+'</select></div>';
      html += '<div id="geo-params">'+current.params.map(function(p) { return '<div class="input-group"><label>'+p.label+':</label><input type="number" id="geo-'+p.n+'" value="5" step="any" style="direction:ltr;text-align:right"></div>'; }).join('')+'</div>';
      html += '<button class="btn btn-primary" id="geo-calc" style="width:100%">📏 محاسبه</button>';
      html += '<div id="geo-result" class="result"></div></div>';
      container.innerHTML = html;

      function calc() {
        var params = {};
        current.params.forEach(function(p) { params[p.n] = parseFloat(document.getElementById('geo-'+p.n).value) || 0; });
        var res = document.getElementById('geo-result');
        if (Object.values(params).some(function(v) { return v <= 0; })) { res.classList.remove('show'); return; }
        var area = current.area(params);
        var lines = '<div class="row"><span class="label">📐 مساحت:</span><span class="value" style="font-size:1.2rem">'+area.toFixed(3)+' واحد²</span></div>';
        if (current.perimeter) lines += '<div class="row"><span class="label">🔲 محیط:</span><span class="value">'+current.perimeter(params).toFixed(3)+' واحد</span></div>';
        if (current.volume) lines += '<div class="row"><span class="label">📦 حجم:</span><span class="value" style="font-size:1.2rem">'+current.volume(params).toFixed(3)+' واحد³</span></div>';
        res.innerHTML = lines; res.classList.add('show');
      }

      document.getElementById('geo-shape').onchange = function() { current = shapes[parseInt(this.value)]; render(); };
      document.getElementById('geo-calc').onclick = calc;
    }    render();
  }
});

  render: function(container) {

          '</select></div>'+
          '<div class="input-group"><label>اندازه متن پایه: <span id="s-size-val">'+fs+'px</span></label>'+
            '<input type="range" id="s-size" min="12" max="24" value="'+fs+'" step="1"></div>'+
          '<button class="btn btn-primary" id="s-apply" style="width:100%;margin-top:8px">✅ اعمال</button>'+
          '<p style="font-size:.7rem;color:var(--text2);margin-top:8px">تغییرات بلافاصله اعمال می‌شوند و در localStorage ذخیره می‌گردند.</p>'+
          '<p style="font-size:.65rem;color:var(--text2);margin-top:4px">فونت‌های آنلاین فقط در حالت آنلاین در دسترس هستند.</p>'+
        '</div>';
      } else if (active === 'بکاپ') {
        p.innerHTML = '<div class="card">'+
          '<button class="btn btn-primary" id="s-export" style="width:100%;margin-bottom:8px">📤 Export (خروجی JSON)</button>'+
          '<button class="btn" id="s-import-btn" style="width:100%;margin-bottom:8px">📥 Import (وارد کردن JSON)</button>'+
          '<input type="file" id="s-import-file" accept=".json" style="display:none">'+
          '<div class="row" style="margin:12px 0;border-top:1px solid var(--border);padding-top:12px"></div>'+
          '<button class="btn btn-accent" id="s-clear" style="width:100%">🗑️ پاک کردن همه داده‌ها</button>'+
          '<p style="font-size:.7rem;color:var(--danger);margin-top:6px">⚠️ این عمل تمام داده‌های ذخیره‌شده را حذف می‌کند و قابل بازگشت نیست!</p>'+
          '<div id="s-msg" style="margin-top:8px;min-height:20px;font-size:.8rem;font-weight:700;text-align:center"></div>'+
        '</div>';
      } else {
        p.innerHTML = '<div class="card"><div id="s-stats"><div class="loading"><div class="spinner"></div>در حال بارگذاری...</div></div></div>';
        loadStats();
      }

      container.appendChild(tb); container.appendChild(p);

        showToast('تنظیمات ذخیره شد ✅');

      // Export
      var exportEl = container.querySelector('#s-export');

        exportAllData().then(function(data) {
          var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a'); a.href = url; a.download = 'toolbox-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
          URL.revokeObjectURL(url);
          showToast('بکاپ با موفقیت ذخیره شد ✅');
        }).catch(function() { showToast('خطا در export ❌'); });
      };

      // Import
      var impBtn = container.querySelector('#s-import-btn');
      var impFile = container.querySelector('#s-import-file');
      if (impBtn && impFile) {
        impBtn.onclick = function() { impFile.click(); };
        impFile.onchange = function() {
          var file = this.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(e) {
            try {
              var data = JSON.parse(e.target.result);
              importAllData(data).then(function() {
                var msg = container.querySelector('#s-msg');
                msg.textContent = '✅ داده‌ها با موفقیت وارد شدند. صفحه رفرش می‌شود...';
                msg.style.color = 'var(--success)';

              }).catch(function(err) {
                var msg = container.querySelector('#s-msg');
                msg.textContent = '❌ خطا در import: ' + (err.message||err);
                msg.style.color = 'var(--danger)';
              });

              var msg = container.querySelector('#s-msg');
              msg.textContent = '❌ فایل JSON معتبر نیست';
              msg.style.color = 'var(--danger)';
            }
          };
          reader.readAsText(file);
        };
      }

      // Clear
      var clearEl = container.querySelector('#s-clear');

        if (confirm('آیا مطمئن هستید؟ همه داده‌ها (یادداشت‌ها، رمزها، علاقه‌مندی‌ها، ابزارهای اخیر، تنظیمات) پاک می‌شوند!')) {
          clearAllData().then(function() {
            var msg = container.querySelector('#s-msg');
            msg.textContent = '🗑️ همه داده‌ها پاک شدند. صفحه رفرش می‌شود...';
            msg.style.color = 'var(--danger)';
            setTimeout(function() { location.reload(); }, 1500);
          });
        }
      };
    }

    function loadStats() {
      Promise.all([
        openDB().then(function(d) {
          var stores = Array.from(d.objectStoreNames);
          return Promise.all(stores.map(function(s) {
            return new Promise(function(res) {
              var tx = d.transaction(s, 'readonly');
              var req = tx.objectStore(s).count();
              req.onsuccess = function() { res({store:s, count:req.result}); };
              req.onerror = function() { res({store:s, count:'?'}); };
            });
          }));
        }),
        Promise.resolve({
          tools: getAllTools().length,
          favorites: 0,
          theme: document.documentElement.dataset.theme || 'dark',
          fontSize: parseInt(lsGet('fontSize','16'))||16,
          font: lsGet('fontFamily','system'),
        })
      ]).then(function(results) {
        var dbStats = results[0];
        var appStats = results[1];
        getFavorites().then(function(favs) { appStats.favorites = favs.length; });
        var statsDiv = container.querySelector('#s-stats');
        if (!statsDiv) return;
        var storageEstimate = 'محاسبه...';
        if (navigator.storage && navigator.storage.estimate) {
          navigator.storage.estimate().then(function(est) {
            storageEstimate = Math.round((est.usage||0)/1024) + ' KB / ' + Math.round((est.quota||0)/1024/1024) + ' MB';
            statsDiv.innerHTML = buildStatsHTML(dbStats, appStats, storageEstimate);
          });
        } else {
          statsDiv.innerHTML = buildStatsHTML(dbStats, appStats, storageEstimate);
        }
      });
    }

    function buildStatsHTML(dbStats, appStats, storage) {
      return '<div class="loan-summary" style="margin-bottom:12px">'+
        '<div class="loan-box"><div class="num" style="font-size:1.5rem">'+appStats.tools+'</div><div class="lbl">🧰 تعداد ابزارها</div></div>'+
        '<div class="loan-box"><div class="num">'+appStats.favorites+'</div><div class="lbl">⭐ علاقه‌مندی‌ها</div></div>'+
        '<div class="loan-box"><div class="num">'+appStats.theme+'</div><div class="lbl">🎨 تم</div></div>'+
        '<div class="loan-box"><div class="num">'+appStats.fontSize+'px</div><div class="lbl">🔤 سایز فونت</div></div>'+
      '</div>'+
      '<div class="row"><span class="label">💾 فضای مصرفی:</span><span class="value">'+storage+'</span></div>'+
      dbStats.map(function(s) { return '<div class="row"><span class="label">📦 '+s.store+':</span><span class="value">'+s.count+' رکورد</span></div>'; }).join('')+
      '<div class="row"><span class="label">🖋️ فونت:</span><span class="value">'+appStats.font+'</span></div>';
    }

    renderPanel();
  }
});

// ─── Settings helpers ───
function applyFont(font) {
  var existing = document.getElementById('__customFont');
  if (existing) existing.remove();
  if (font === 'vazir') {
    var link = document.createElement('link');
    link.id = '__customFont';
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/Vazirmatn-font-face.css';
    document.head.appendChild(link);
    document.documentElement.style.setProperty('--font', "'Vazirmatn', system-ui, sans-serif");

async function exportAllData() {
  var data = { version: '1.2.1', exported: new Date().toISOString(), localStorage: {}, indexedDB: {} };
  // LocalStorage
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.indexOf('tp_') === 0) {
      try { data.localStorage[key] = JSON.parse(localStorage.getItem(key)); } catch(e) { data.localStorage[key] = localStorage.getItem(key); }
    }
  }
  // IndexedDB
  var d = await openDB();
  var stores = Array.from(d.objectStoreNames);
  for (var si = 0; si < stores.length; si++) {
    var store = stores[si];
    var all = await dbGetAll(store);
    var keys = await dbGetAllKeys(store);
    data.indexedDB[store] = {};
    for (var ki = 0; ki < keys.length; ki++) {
      data.indexedDB[store][String(keys[ki])] = all[ki];
    }
  }
  return data;
}

async function importAllData(data) {
  if (!data || !data.localStorage || !data.indexedDB) throw new Error('فرمت نادرست');
  // Clear existing
  await clearAllData();
  // Restore localStorage
  Object.keys(data.localStorage).forEach(function(k) {
    try { localStorage.setItem(k, JSON.stringify(data.localStorage[k])); } catch(e) {}
  });
  // Restore IndexedDB
  var d = await openDB();
  await Promise.all(Object.keys(data.indexedDB).map(function(store) {
    var entries = data.indexedDB[store];
    return Promise.all(Object.keys(entries).map(function(key) {
      return new Promise(function(resolve, reject) {
        var tx = d.transaction(store, 'readwrite');
        var req = tx.objectStore(store).put(entries[key], key);
        req.onsuccess = resolve;
        req.onerror = resolve;
      });
    }));
  }));
}

async function clearAllData() {
  // Clear localStorage with tp_ prefix
  for (var i = localStorage.length - 1; i >= 0; i--) {
    var key = localStorage.key(i);
    if (key.indexOf('tp_') === 0 || key === 'theme') localStorage.removeItem(key);
  }
  // Clear IndexedDB
  var d = await openDB();
  var stores = Array.from(d.objectStoreNames);
  await Promise.all(stores.map(function(store) {
    return new Promise(function(resolve, reject) {
      var tx = d.transaction(store, 'readwrite');
      var req = tx.objectStore(store).clear();
      req.onsuccess = resolve;
      req.onerror = resolve;
    });
  }));
}

function luhnCheck(num) {
  let sum = 0;
  for (let i = 0; i < num.length; i++) {
    let d = parseInt(num[num.length - 1 - i]);
    if (i % 2 === 1) d *= 2;
    if (d > 9) d -= 9;
    sum += d;
  }
  return sum % 10 === 0;
}

    const bankCode = raw.substring(4, 7);

    // Validate checksum (simplified)
    const digits = raw.substring(4) + raw.substring(0, 4);
    let numStr = '';
    for (const ch of digits) {
      if (ch >= '0' && ch <= '9') numStr += ch;
      else numStr += (ch.charCodeAt(0) - 55).toString();
    }
    let remainder = BigInt(numStr) % 97n;
    const valid = remainder === 1n;

    const formatted = raw.match(/.{1,4}/g).join(' ');
    const resultBox = container.querySelector('#sheba-result');
    resultBox.innerHTML = `
      <div style="text-align:center;line-height:2.2">

function renderEidi(container) {
  container.innerHTML = `
    <div class="input-group">
      <label>آخرین حقوق ماهیانه (تومان):</label>
      <input type="text" id="eidi-salary" placeholder="مثال: 10000000" style="direction:ltr;text-align:center;font-size:16px">
    </div>
    <div class="input-group">
      <label>ماههای کارکرد در سال:</label>
      <input type="number" id="eidi-months" placeholder="12" min="1" max="12" value="12" style="direction:ltr;text-align:center;width:80px">
    </div>
    <button class="btn btn-primary" id="eidi-calc" style="width:100%;margin-top:8px">محاسبه</button>
    <div id="eidi-result" style="display:none;margin-top:12px;padding:14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius)"></div>
    <div style="font-size:11px;color:var(--text2);margin-top:8px;text-align:center">بر اساس قانون کار جمهوری اسلامی ایران</div>
  `;

  container.querySelector('#eidi-calc').addEventListener('click', () => {
    const salaryStr = container.querySelector('#eidi-salary').value.replace(/[^\d]/g, '');
    const months = parseInt(container.querySelector('#eidi-months').value, 10);
    const salary = parseInt(salaryStr, 10);

    if (!salary || salary <= 0) { showToast('لطفاً حقوق ماهیانه را وارد کنید'); return; }
    if (!months || months < 1 || months > 12) { showToast('ماههای کارکرد باید بین ۱ تا ۱۲ باشد'); return; }

    const dailySalary = salary / 30;
    const eidiByMonth = salary * 2;
    const eidiByDay = dailySalary * 30;
    const eidi = Math.min(eidiByMonth, eidiByDay);
    const proratedEidi = Math.round((eidi / 12) * months);
    const seniority = Math.round((salary / 12) * months);

    const fmt = (n) => n.toLocaleString('fa-IR');
    const resultBox = container.querySelector('#eidi-result');
    resultBox.innerHTML = `
      <div style="text-align:center;line-height:2.4">
        <div style="font-size:18px">🎁 عیدی</div>
        <div>مبلغ کامل: <strong>${fmt(eidi)} تومان</strong></div>
        <div>عیدی (${months} ماه): <strong style="color:#2ecc71;font-size:18px">${fmt(proratedEidi)} تومان</strong></div>
        <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
        <div style="font-size:18px">💰 سنوات</div>
        <div>سنوات (${months} ماه): <strong style="color:#2ecc71;font-size:18px">${fmt(seniority)} تومان</strong></div>
        <hr style="border:0;border-top:1px solid var(--border);margin:12px 0">
        <div style="font-size:16px">📊 جمع کل: <strong style="color:#f39c12;font-size:20px">${fmt(proratedEidi + seniority)} تومان</strong></div>
      </div>
    `;
    resultBox.style.display = 'block';
  });
}

    desc: 'نمایش قیمت لحظه‌ای ارز، سکه و ارز دیجیتال',
    render(container) {
      const CURRENCIES = [
        { key: 'usd', label: 'دلار', icon: '💵' },
        { key: 'eur', label: 'یورو', icon: '💶' },
        { key: 'gbp', label: 'پوند', icon: '💷' },

        { key: 'btc', label: 'بیتکوین', icon: '₿' },
        { key: 'eth', label: 'اتریوم', icon: '⟠' }
      ];

      let prices = {};
      CURRENCIES.forEach(c => { prices[c.key] = { price: '---', change: '---', changePercent: '---' }; });

      container.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
          <button class="btn btn-primary" id="ir-refresh">🔄 بروزرسانی</button>

          منبع: CoinGecko (رمزارز) — قیمت‌های ارز و سکه را میتوانید دستی وارد کنید
        </div>
      `;

      const grid = container.querySelector('#ir-grid');
      const statusEl = container.querySelector('#ir-status');

      function renderGrid() {
        grid.innerHTML = CURRENCIES.map(c => {
          const d = prices[c.key];
          const changeColor = d.change === '---' ? 'var(--text2)' : (parseFloat(String(d.change).replace(/,/g, '')) >= 0 ? '#22c55e' : '#ef4444');
          return `
            <div style="padding:12px;border-radius:10px;background:var(--glass);border:1px solid var(--border)">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

                <span style="font-weight:700;font-size:14px">${c.label}</span>

              <div style="font-size:22px;font-weight:700;direction:ltr;text-align:right;margin-bottom:4px" id="ir-price-${c.key}">${d.price}</div>
              <div style="display:flex;justify-content:space-between;font-size:12px;direction:ltr">
                <span style="color:${changeColor}" id="ir-change-${c.key}">${d.change}</span>
                <span style="color:${changeColor}" id="ir-pct-${c.key}">${d.changePercent}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      async function fetchPrices() {
        statusEl.textContent = '⏳ در حال دریافت...';
        let successCount = 0;

        // Fetch crypto from CoinGecko (reliable API)
        try {
          const resp = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true', { signal: AbortSignal.timeout(10000) });
          if (resp.ok) {
            const data = await resp.json();
            if (data.bitcoin) {
              prices.btc.price = '$' + (data.bitcoin.usd || 0).toLocaleString();
              prices.btc.changePercent = (data.bitcoin.usd_24h_change?.toFixed(2) || '---') + '%';
              prices.btc.change = data.bitcoin.usd_24h_change >= 0 ? '+' : '';
              successCount++;
            }
            if (data.ethereum) {
              prices.eth.price = '$' + (data.ethereum.usd || 0).toLocaleString();
              prices.eth.changePercent = (data.ethereum.usd_24h_change?.toFixed(2) || '---') + '%';
              prices.eth.change = data.ethereum.usd_24h_change >= 0 ? '+' : '';
              successCount++;
            }
          }
        } catch (e) { console.log('CoinGecko error:', e); }

        // Try to fetch from a free exchange rate API for USD/IRR
        try {
          const resp = await fetch('https://api.exchangerate-api.com/v4/latest/USD', { signal: AbortSignal.timeout(10000) });
          if (resp.ok) {
            const data = await resp.json();
            if (data.rates && data.rates.IRR) {
              const irrRate = Math.round(data.rates.IRR);
              prices.usd.price = irrRate.toLocaleString('fa-IR') + ' ریال';
              successCount++;
            }
            if (data.rates && data.rates.EUR) {
              prices.eur.price = '€1 = ' + Math.round(data.rates.IRR / data.rates.EUR).toLocaleString('fa-IR') + ' ریال';
              successCount++;
            }
          }
        } catch (e) { console.log('Exchange rate error:', e); }

        if (successCount > 0) {
          statusEl.textContent = `✅ ${successCount} مورد بروزرسانی شد`;
          statusEl.style.color = '#22c55e';
        } else {
          statusEl.textContent = '⚠️ خطا در دریافت — قیمتها را دستی وارد کنید';
          statusEl.style.color = '#f39c12';
        }

        // Load saved prices from localStorage
        try {
          const saved = JSON.parse(localStorage.getItem('tp_market_prices') || '{}');
          CURRENCIES.forEach(c => {
            if (saved[c.key] && prices[c.key].price === '---') {
              prices[c.key] = saved[c.key];
            }
          });
        } catch {}

        renderGrid();
      }

      // Save prices to localStorage
      function savePrices() {
        try { localStorage.setItem('tp_market_prices', JSON.stringify(prices)); } catch {}
      }

      // Manual price edit
      function editPrice(key) {
        const current = prices[key].price === '---' ? '' : prices[key].price;
        const val = prompt(`قیمت ${CURRENCIES.find(c => c.key === key)?.label || key} را وارد کنید:`, current);
        if (val !== null && val.trim()) {
          prices[key].price = val.trim();
          savePrices();
          renderGrid();
        }
      }

      // Make editPrice globally accessible
      window.__editMarketPrice = editPrice;

      // Re-render with click handlers
      function renderGridWithHandlers() {
        renderGrid();
        CURRENCIES.forEach(c => {
          const el = container.querySelector(`#ir-price-${c.key}`);
          if (el) {
            el.style.cursor = 'pointer';
            el.title = 'کلیک برای ویرایش دستی';
            el.addEventListener('click', () => editPrice(c.key));
          }
        });
      }

      // Override renderGrid to include handlers
      const origRenderGrid = renderGrid;
      renderGrid = function() {
        origRenderGrid();
        CURRENCIES.forEach(c => {
          const el = container.querySelector(`#ir-price-${c.key}`);
          if (el) {
            el.style.cursor = 'pointer';
            el.title = 'کلیک برای ویرایش دستی';
            el.addEventListener('click', () => editPrice(c.key));
          }
        });
      };

      container.querySelector('#ir-refresh').addEventListener('click', fetchPrices);
      container.querySelector('#ir-auto').addEventListener('change', (e) => {
        if (e.target.checked) {
          fetchPrices();
          window._marketRefreshTimer = setInterval(fetchPrices, 60000);
        } else {
          clearInterval(window._marketRefreshTimer);
        }
      });

      // Initial fetch
      fetchPrices();
    }
  }
];

registerTools(marketTools);

// ─── Utility: Simple Markdown Renderer ───
function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    // Code blocks (must come first to protect content)
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^######\s+(.+)$/gm, '<h6>$1</h6>')
    .replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>')
    .replace(/^####\s+(.+)$/gm, '<h4>$1</h4>')
    .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
    .replace(/^#\s+(.+)$/gm, '<h1>$1</h1>')
    // Bold & italic
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    // Strikethrough
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    // Links & images
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // Horizontal rule
    .replace(/^---+$/gm, '<hr>')
    // Unordered lists
    .replace(/^[\s]*[-*+]\s+(.+)$/gm, '<li>$1</li>')
    // Blockquotes
    .replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  // Paragraphs: wrap lines that aren't already tags
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (/^<(h[1-6]|ul|ol|li|pre|blockquote|hr|img|div|table)/.test(line.trim())) return line;
    return `<p>${line}</p>`;
  }).join('\n');

  return html;
}

// ─── Utility: Generate Password ───
function generatePassword(length = 16) {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
  const arr = new Uint32Array(length);
  crypto.getRandomValues(arr);
  return Array.from(arr, v => chars[v % chars.length]).join('');
}

// ─── Utility: Download file ───
function downloadFile(filename, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

            <input type="text" id="note-title" placeholder="عنوان یادداشت..." style="flex:1;padding:8px;border:1px solid var(--border,#ccc);border-radius:6px;font-size:15px;font-weight:600">
            <button class="btn" id="save-note-btn" style="padding:8px 16px;border:none;border-radius:6px;background:#10b981;color:#fff;cursor:pointer">💾 ذخیره</button>
            <button class="btn" id="export-note-btn" style="padding:8px 16px;border:none;border-radius:6px;background:#6366f1;color:#fff;cursor:pointer">📥 خروجی MD</button>
            <button class="btn" id="delete-note-btn" style="padding:8px 16px;border:none;border-radius:6px;background:#ef4444;color:#fff;cursor:pointer">🗑️ حذف</button>
          </div>
          <div style="display:flex;gap:8px;flex:1;overflow:hidden">
            <textarea id="note-editor" placeholder="اینجا بنویسید... (Markdown)" style="flex:1;resize:none;padding:12px;border:1px solid var(--border,#ccc);border-radius:8px;font-family:monospace;font-size:14px;line-height:1.6"></textarea>
            <div id="note-preview" style="flex:1;overflow-y:auto;padding:12px;border:1px solid var(--border,#ccc);border-radius:8px;background:var(--bg-alt,#fafafa);font-size:14px;line-height:1.7"></div>
          </div>
        </div>
      </div>`;

    const $ = id => container.querySelector('#' + id);
    const listEl = $('notes-list');
    const titleEl = $('note-title');
    const editorEl = $('note-editor');
    const previewEl = $('note-preview');
    const searchEl = $('note-search');

    async function loadNotes() {
      allNotes = await dbGetAll('notes');
      allNotes.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      renderList(allNotes);
    }

    function renderList(notes) {
      listEl.innerHTML = notes.length === 0
        ? '<div style="text-align:center;color:#999;padding:20px;font-size:13px">یادداشتی وجود ندارد</div>'
        : notes.map(n => `
          <div class="card note-item" data-id="${n.id}" style="padding:10px;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid var(--border,#eee);${currentNote && currentNote.id === n.id ? 'background:#eef2ff;border-color:#818cf8' : ''}">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.title || 'بدون عنوان'}</div>
            <div style="font-size:11px;color:#888;margin-top:2px">${new Date(n.updatedAt || n.createdAt).toLocaleDateString('fa-IR')}</div>
          </div>
        `).join('');

      listEl.querySelectorAll('.note-item').forEach(el => {
        el.onclick = () => openNote(allNotes.find(n => n.id === el.dataset.id));
      });
    }

    function openNote(note) {
      currentNote = note;
      titleEl.value = note ? note.title || '' : '';
      editorEl.value = note ? note.content || '' : '';
      updatePreview();
      renderList(allNotes);
    }

    function updatePreview() {
      previewEl.innerHTML = renderMarkdown(editorEl.value);
    }

    editorEl.oninput = updatePreview;

    searchEl.oninput = () => {
      const q = searchEl.value.trim().toLowerCase();
      renderList(q ? allNotes.filter(n => (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q)) : allNotes);
    };

    $('new-note-btn').onclick = () => {
      currentNote = null;
      titleEl.value = '';
      editorEl.value = '';
      previewEl.innerHTML = '';
      renderList(allNotes);
    };

    $('save-note-btn').onclick = async () => {
      const now = Date.now();
      const note = currentNote
        ? { ...currentNote, title: titleEl.value, content: editorEl.value, updatedAt: now }
        : { id: 'note_' + now + '_' + Math.random().toString(36).slice(2, 7), title: titleEl.value, content: editorEl.value, createdAt: now, updatedAt: now };
      await dbPut('notes', note);
      currentNote = note;
      showToast('یادداشت ذخیره شد ✅');
      await loadNotes();
    };

    $('delete-note-btn').onclick = async () => {
      if (!currentNote) return showToast('یادداشتی انتخاب نشده', 'warn');
      await dbDelete('notes', currentNote.id);
      currentNote = null;
      titleEl.value = '';
      editorEl.value = '';
      previewEl.innerHTML = '';
      showToast('یادداشت حذف شد 🗑️');
      await loadNotes();
    };

    $('export-note-btn').onclick = () => {
      if (!editorEl.value) return showToast('محتوایی برای خروجی وجود ندارد', 'warn');
      const fname = (titleEl.value || 'note').replace(/[^a-zA-Z0-9\u0600-\u06FF_-]/g, '_') + '.md';
      downloadFile(fname, editorEl.value, 'text/markdown');
      showToast('فایل MD دانلود شد 📥');
    };

    loadNotes();
  }
};

      linesEl.textContent = count ? `${count} خط` : '';

      try {
        return { ok: true, data: JSON.parse(inputEl.value) };

        const m = e.message.match(/position\s+(\d+)/i);
        let line = '';
        if (m) {
          const pos = +m[1];

      resultEl.textContent = JSON.stringify(r.data);

      statusEl.textContent = 'فشرده';
    };

    $('jf-validate').onclick = () => {
      const r = parse();
      if (r.ok) {
        errorEl.innerHTML = '<span style="color:#10b981">✅ JSON معتبر است</span>';
      } else {
        errorEl.innerHTML = `<span style="color:#dc2626">❌ ${esc(r.error)}</span>`;

    };

      const text = resultEl.textContent;

      showToast('کپی شد 📋');

  }

      { label: '#️⃣ Hex Color', pattern: '#[0-9a-fA-F]{3,8}' },
      { label: '🔢 Integer', pattern: '-?\\d+' },
    ];

    container.innerHTML = `
      <div class="card" style="padding:16px;max-width:680px;margin:0 auto">
        <h3 style="margin-bottom:12px">🔎 Regex Tester پیشرفته</h3>
        <div class="input-group" style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
          <span style="font-size:16px;font-family:monospace;color:#666">/</span>
          <input type="text" id="rx-pattern" placeholder="الگوی regex" style="flex:1;padding:8px;border:1px solid var(--border,#ccc);border-radius:6px;font-family:monospace;direction:ltr;text-align:left;font-size:14px">
          <span style="font-size:16px;font-family:monospace;color:#666">/</span>
          <label style="font-size:13px;display:flex;align-items:center;gap:2px"><input type="checkbox" id="rx-g" checked> g</label>
          <label style="font-size:13px;display:flex;align-items:center;gap:2px"><input type="checkbox" id="rx-i"> i</label>
          <label style="font-size:13px;display:flex;align-items:center;gap:2px"><input type="checkbox" id="rx-m"> m</label>
          <label style="font-size:13px;display:flex;align-items:center;gap:2px"><input type="checkbox" id="rx-s"> s</label>
        </div>
        <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px">
          ${presets.map(p => `<button class="btn rx-preset" data-pattern="${esc(p.pattern)}" style="padding:4px 10px;border:1px solid var(--border,#ccc);border-radius:16px;background:transparent;cursor:pointer;font-size:12px;white-space:nowrap">${p.label}</button>`).join('')}
        </div>
        <textarea id="rx-test" placeholder="متن آزمایشی را اینجا وارد کنید..." style="width:100%;height:100px;padding:10px;border:1px solid var(--border,#ccc);border-radius:8px;font-size:13px;resize:vertical;direction:ltr;text-align:left"></textarea>
        <div style="display:flex;gap:16px;margin:8px 0;font-size:13px;color:#666">
          <span id="rx-count">تطابق: 0</span>
          <span id="rx-explain"></span>
        </div>
        <div id="rx-result" style="background:var(--bg-alt,#f5f5f5);border:1px solid var(--border,#ddd);border-radius:8px;padding:12px;font-size:13px;max-height:240px;overflow-y:auto;min-height:60px;direction:ltr;text-align:left;font-family:monospace;white-space:pre-wrap;word-break:break-all;line-height:1.8"></div>
      </div>`;

    const $ = id => container.querySelector('#' + id);
    const patternEl = $('rx-pattern');
    const testEl = $('rx-test');
    const resultEl = $('rx-result');
    const countEl = $('rx-count');
    const explainEl = $('rx-explain');

    function getFlags() {
      let f = '';
      if ($('rx-g').checked) f += 'g';
      if ($('rx-i').checked) f += 'i';
      if ($('rx-m').checked) f += 'm';
      if ($('rx-s').checked) f += 's';
      return f;
    }

    function explainRegex(pattern) {
      const explanations = [];
      if (/^\[.*\]$/.test(pattern)) explanations.push('کلاس کاراتر');
      if (/\{[\d,]+\}/.test(pattern)) explanations.push('تکرار مشخص');
      if (/[+*?]/.test(pattern)) explanations.push('کوانتیفایر');
      if (/\\d/.test(pattern)) explanations.push('رقم');
      if (/\\w/.test(pattern)) explanations.push('حرف/رقم/زیرخط');
      if (/\\s/.test(pattern)) explanations.push('فاصله');
      if (/\^/.test(pattern)) explanations.push('شروع خط');
      if (/\$/.test(pattern)) explanations.push('پایان خط');
      if (/[|]/.test(pattern)) explanations.push('یا');
      if (/\(.*\)/.test(pattern)) explanations.push('گروه');
      return explanations.length ? '💡 ' + explanations.join('، ') : '';
    }

    function runRegex() {
      const pattern = patternEl.value;
      const text = testEl.value;
      if (!pattern || !text) {
        resultEl.innerHTML = text || '';
        countEl.textContent = 'تطابق: 0';
        explainEl.textContent = '';
        return;
      }

      explainEl.textContent = explainRegex(pattern);

      try {
        const regex = new RegExp(pattern, getFlags());
        let html = '';
        let count = 0;
        let lastIndex = 0;
        let match;

        if (regex.global) {
          while ((match = regex.exec(text)) !== null) {
            count++;
            // Highlight matched text
            html += esc(text.slice(lastIndex, match.index));
            html += `<mark style="background:#fef08a;padding:1px 2px;border-radius:2px">${esc(match[0])}</mark>`;
            lastIndex = match.index + match[0].length;
            if (match[0].length === 0) { regex.lastIndex++; }
          }
          html += esc(text.slice(lastIndex));
        } else {
          match = regex.exec(text);
          if (match) {
            count = 1;
            html += esc(text.slice(0, match.index));
            html += `<mark style="background:#fef08a;padding:1px 2px;border-radius:2px">${esc(match[0])}</mark>`;
            html += esc(text.slice(match.index + match[0].length));
          } else {
            html = esc(text);
          }
        }

        resultEl.innerHTML = html || esc(text);
        countEl.textContent = `تطابق: ${count}`;

        // Show details
        if (count > 0) {
          let details = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border,#ddd)">';
          let idx = 0;
          const detRegex = new RegExp(pattern, getFlags());
          while ((match = detRegex.exec(text)) !== null && idx < 50) {
            idx++;
            details += `<div style="padding:2px 0"><strong>#${idx}</strong> index:${match.index} → <code>${esc(match[0])}</code>`;
            if (match.length > 1) {
              details += ` groups: ${Array.from(match.slice(1), (g, i) => `$${i + 1}=${esc(g)}`).join(', ')}`;
            }
            details += '</div>';
            if (match[0].length === 0) detRegex.lastIndex++;
            if (!getFlags().includes('g')) break;
          }
          details += '</div>';
          resultEl.innerHTML += details;
        }
      } catch (e) {
        resultEl.innerHTML = `<span style="color:#dc2626">❌ الگوی نامعتبر: ${esc(e.message)}</span>`;
        countEl.textContent = 'تطابق: 0';
      }
    }

    patternEl.oninput = runRegex;
    testEl.oninput = runRegex;
    ['rx-g', 'rx-i', 'rx-m', 'rx-s'].forEach(id => $(id).onchange = runRegex);

    container.querySelectorAll('.rx-preset').forEach(btn => {
      btn.onclick = () => {
        patternEl.value = btn.dataset.pattern;
        runRegex();
      };
    });
  }
};

    }

      return css
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/\s*([{}:;,>~+])\s*/g, '$1')
        .replace(/;}/g, '}')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatCSS(css) {
      let indent = 0;
      const indentStr = '  ';
      let result = '';
      // Remove existing whitespace strategically
      css = css.replace(/\/\*[\s\S]*?\*\//g, '');
      css = css.replace(/\s*([{}:;,>~+])\s*/g, '$1');
      css = css.replace(/;}/g, '}');

      for (let i = 0; i < css.length; i++) {
        const ch = css[i];
        if (ch === '{') {
          result += ' {\n';
          indent++;
          result += indentStr.repeat(indent);
        } else if (ch === '}') {
          indent = Math.max(0, indent - 1);
          result += '\n' + indentStr.repeat(indent) + '}\n';
          if (indent === 0) result += '\n';
        } else if (ch === ';') {
          result += ';\n' + indentStr.repeat(indent);
        } else if (ch === ':' && css[i + 1] !== ':') {
          result += ': ';
          // skip spaces after colon
          while (css[i + 1] === ' ') i++;
        } else if (ch === ' ' && result.endsWith(' ')) {
          continue;
        } else {
          result += ch;
        }
      }
      return result.replace(/\n{3,}/g, '\n\n').trim();

      // Tokenize: split into tags and text
      const tokens = html.replace(/>\s+</g, '><').match(/(<[^>]+>|[^<]+)/g) || [];

          indent = Math.max(0, indent - 1);
          result += indentStr.repeat(indent) + trimmed + '\n';
        } else if (selfClosing.test(trimmed)) {
          result += indentStr.repeat(indent) + trimmed + '\n';
        } else if (opening.test(trimmed)) {
          result += indentStr.repeat(indent) + trimmed + '\n';
          // Don't indent if it's a closing-only tag or void element
          if (!selfClosing.test(trimmed) && !trimmed.endsWith('/>')) {

        } else {

          result += indentStr.repeat(indent) + trimmed + '\n';
        }

      return result.replace(/\n{3,}/g, '\n\n').trim();

      </div>`;

    const $ = id => container.querySelector('#' + id);
    const dropZone = $('cfi-drop');
    const fileInput = $('cfi-file');
    const canvas = $('cfi-canvas');
    const preview = $('cfi-preview');
    const paletteEl = $('cfi-palette');
    const infoEl = $('cfi-info');

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = '#4f46e5'; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = ''; };
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '';
      if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    };
    fileInput.onchange = (e) => { if (e.target.files.length) processFile(e.target.files[0]); };

    function processFile(file) {
      if (!file.type.startsWith('image/')) return showToast('لطفاً یک تصویر انتخاب کنید', 'warn');
      const img = new Image();
      img.onload = () => {
        preview.src = img.src;
        preview.style.display = '';
        // Sample on a small canvas for performance
        const size = 150;
        const ratio = img.width / img.height;
        canvas.width = size;
        canvas.height = Math.round(size / ratio);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        extractColors(ctx, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }

    function extractColors(ctx, w, h) {
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;

      // Sample pixels from a grid
      const colorMap = {};
      const stepX = Math.max(1, Math.floor(w / 20));
      const stepY = Math.max(1, Math.floor(h / 20));

      for (let y = 0; y < h; y += stepY) {
        for (let x = 0; x < w; x += stepX) {
          const i = (y * w + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          // Quantize to reduce similar colors
          const qr = Math.round(r / 32) * 32;
          const qg = Math.round(g / 32) * 32;
          const qb = Math.round(b / 32) * 32;
          const key = `${qr},${qg},${qb}`;
          if (!colorMap[key]) colorMap[key] = { r: 0, g: 0, b: 0, count: 0 };
          colorMap[key].r += r;
          colorMap[key].g += g;
          colorMap[key].b += b;
          colorMap[key].count++;
        }
      }

      // Sort by frequency and pick top colors
      const sorted = Object.values(colorMap).sort((a, b) => b.count - a.count);
      const topColors = sorted.slice(0, 8).map(c => ({
        r: Math.round(c.r / c.count),
        g: Math.round(c.g / c.count),
        b: Math.round(c.b / c.count)
      }));

      renderPalette(topColors);
    }

    function renderPalette(colors) {
      paletteEl.innerHTML = colors.map(c => {
        const hex = '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('');
        const lum = (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
        const textColor = lum > 0.5 ? '#000' : '#fff';
        return `
          <div class="cfi-swatch" data-hex="${esc(hex)}" data-rgb="rgb(${c.r},${c.g},${c.b})" style="width:70px;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--border,#ddd);transition:transform 0.15s">
            <div style="height:56px;background:${hex}"></div>
            <div style="padding:4px 6px;font-size:11px;text-align:center;background:var(--bg,#fff)">
              <div style="font-weight:600">${hex}</div>
              <div style="color:#888;font-size:10px">${c.r},${c.g},${c.b}</div>
            </div>
          </div>`;
      }).join('');

      infoEl.textContent = `${colors.length} رنگ غالب استخراج شد — روی هر رنگ کلیک کنید تا کپی شود`;

      paletteEl.querySelectorAll('.cfi-swatch').forEach(el => {
        el.onmouseenter = () => el.style.transform = 'scale(1.08)';
        el.onmouseleave = () => el.style.transform = '';
        el.onclick = () => {
          const hex = el.dataset.hex;
          navigator.clipboard.writeText(hex);
          showToast(`${hex} کپی شد 📋`);
        };
      });
    }
  }
};
