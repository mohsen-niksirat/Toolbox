const jalaliTool = {
  id: 'other-jalali', name: 'تقویم شمسی', icon: '📆', category: 'other',
  keywords: ['تقویم', 'شمسی', 'میلادی', 'calendar', 'jalali'],
  desc: 'نمایش تاریخ شمسی و میلادی',
  render(container) {
    const MONTHS_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    const DAYS_FA = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];

    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
      let gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
      let jy = -1595 + (33 * Math.floor(days / 12053));
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
      let jm, jd;
      if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
      else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
      return [jy, jm, jd];
    }

    let viewYear, viewMonth;
    const now = new Date();
    const [curJY, curJM, curJD] = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
    viewYear = curJY; viewMonth = curJM;

    function jalaliMonthDays(y, m) {
      if (m <= 6) return 31;
      if (m <= 11) return 30;
      const isLeap = (((((y % 4) === 0) && ((y % 100) !== 0)) || ((y % 400) === 0)) ? true : false);
      // More accurate leap year for Jalali
      const r = y % 2820;
      const lp = (((r % 4 === 0 && r % 100 !== 0) || r % 400 === 0) || (r <= 776 && r % 4 === 0));
      return lp ? 30 : 29;
    }

    function renderCal() {
      const days = jalaliMonthDays(viewYear, viewMonth);
      // 1st day of month weekday
      const firstGreg = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (curJD - 1));
      // Approximate: compute weekday from known reference
      // Use a simpler approach: convert 1st of jalali month to gregorian
      function jalaliToGregorian(jy, jm, jd) {
        jy += 1595;
        let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
        let gy = 400 * Math.floor(days / 146097);
        days %= 146097;
        if (days > 36524) { days--; gy += 100 * Math.floor(days / 36524); days %= 36524; if (days >= 365) days++; }
        gy += 4 * Math.floor(days / 1461);
        days %= 1461;
        if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
        const gd = days + 1;
        const sal_a = [0,31,((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
        let gm;
        for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) ;
        return [gy, gm, gd - (sal_a[gm - 1] || 0)];
      }
      const [fgY, fgM, fgD] = jalaliToGregorian(viewYear, viewMonth, 1);
      const firstDay = new Date(fgY, fgM - 1, fgD).getDay();
      // Convert: Iranian week starts Saturday (6 in JS for Sat)
      const startOffset = (firstDay + 1) % 7; // Sat=0
      let html = `<div class="tool-section" style="text-align:center">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <button class="btn btn-ghost" id="jPrev">◀</button>
          <div>
            <div style="font-size:1.3rem;font-weight:900">${MONTHS_FA[viewMonth - 1]} ${viewYear}</div>
            <div style="font-size:.7rem;color:var(--text2)">${now.toLocaleDateString('fa-IR')}</div>
          </div>
          <button class="btn btn-ghost" id="jNext">▶</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px">
          ${DAYS_FA.map(d => `<div style="font-size:.6rem;color:var(--text2);padding:4px">${d.substring(0,2)}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;
      for (let i = 0; i < startOffset; i++) html += '<div></div>';
      for (let d = 1; d <= days; d++) {
        const isToday = (viewYear === curJY && viewMonth === curJM && d === curJD);
        const isFri = (startOffset + d - 1) % 7 === 0;
        html += `<div style="padding:6px;border-radius:6px;cursor:pointer;font-size:.8rem;
          ${isToday ? 'background:var(--accent);color:#fff;font-weight:900' : isFri ? 'color:var(--danger)' : ''}">${d}</div>`;
      }
      html += `</div></div>`;
      container.innerHTML = html;
      container.querySelector('#jPrev').onclick = () => { viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; } renderCal(); };
      container.querySelector('#jNext').onclick = () => { viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; } renderCal(); };
    }
    renderCal();
  }
};

// 4. Drawing Canvas — نقاشی
// ═══════════════════════════════════════════
const drawingTool = {
  id: 'other-drawing', name: 'نقاشی Canvas', icon: '🖌️', category: 'other',
  keywords: ['نقاشی', 'drawing', 'canvas', 'طراحی'],
  desc: 'ابزار نقاشی و طراحی',
  render(container) {
    container.innerHTML = `
      <div class="tool-section">
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px">
          <select id="drawTool" class="input" style="width:auto">
            <option value="pen">✏️ قلم</option>
            <option value="line">📏 خط</option>
            <option value="rect">⬜ مستطیل</option>
            <option value="circle">⭕ دایره</option>
            <option value="eraser">🧹 پاک‌کن</option>
          </select>
          <input type="color" id="drawColor" value="#ffffff" style="width:36px;height:30px;border:none;cursor:pointer">
          <label style="font-size:.7rem;color:var(--text2)">اندازه: <input type="range" id="drawSize" min="1" max="30" value="3" style="width:60px;vertical-align:middle"></label>
          <span id="drawSizeVal" style="font-size:.7rem;color:var(--text2)">3</span>
        </div>
        <canvas id="drawCanvas" width="400" height="400" style="width:100%;max-width:500px;border:1px solid var(--border);border-radius:8px;background:#1a1a2e;cursor:crosshair;display:block;margin:0 auto"></canvas>
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" id="drawUndo">↩️ بازگشت</button>
          <button class="btn btn-ghost" id="drawClear">🗑️ پاک کردن</button>
          <button class="btn btn-accent" id="drawSave">💾 دانلود PNG</button>
        </div>
      </div>`;
    const canvas = container.querySelector('#drawCanvas');
    const ctx = canvas.getContext('2d');
    const toolSel = container.querySelector('#drawTool');
    const colorIn = container.querySelector('#drawColor');
    const sizeIn = container.querySelector('#drawSize');
    const sizeVal = container.querySelector('#drawSizeVal');
    let drawing = false, startX, startY, history = [], snapshot;

    sizeIn.oninput = () => sizeVal.textContent = sizeIn.value;

    function save() { history.push(canvas.toDataURL()); if (history.length > 30) history.shift(); }

    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return [(t.clientX - r.left) * (canvas.width / r.width), (t.clientY - r.top) * (canvas.height / r.height)];
    }

    function startDraw(e) {
      e.preventDefault(); drawing = true;
      [startX, startY] = getPos(e);
      if (toolSel.value === 'pen' || toolSel.value === 'eraser') {
        save(); ctx.beginPath(); ctx.moveTo(startX, startY);
      } else {
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        save();
      }
    }
    function draw(e) {
      if (!drawing) return; e.preventDefault();
      const [x, y] = getPos(e);
      const tool = toolSel.value;
      if (tool === 'pen') {
        ctx.strokeStyle = colorIn.value; ctx.lineWidth = sizeIn.value;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineTo(x, y); ctx.stroke();
      } else if (tool === 'eraser') {
        ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = sizeIn.value * 3;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineTo(x, y); ctx.stroke();
      } else {
        ctx.putImageData(snapshot, 0, 0);
        ctx.strokeStyle = colorIn.value; ctx.lineWidth = sizeIn.value;
        if (tool === 'line') { ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke(); }
        else if (tool === 'rect') { ctx.strokeRect(startX, startY, x - startX, y - startY); }
        else if (tool === 'circle') {
          const rx = Math.abs(x - startX) / 2, ry = Math.abs(y - startY) / 2;
          ctx.beginPath(); ctx.ellipse((startX + x) / 2, (startY + y) / 2, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    function endDraw() { drawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    container.querySelector('#drawUndo').onclick = () => {
      if (history.length) {
        const img = new Image();
        img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); };
        img.src = history.pop();
      }
    };
    container.querySelector('#drawClear').onclick = () => { save(); ctx.clearRect(0, 0, canvas.width, canvas.height); };
    container.querySelector('#drawSave').onclick = () => {
      const a = document.createElement('a'); a.download = 'drawing.png'; a.href = canvas.toDataURL(); a.click();
    };
  }
};

const markdownTool = {

  keywords: ['markdown', 'ویرایشگر', 'editor', 'md'],
  desc: 'ویرایشگر Markdown با پیش‌نمایش زنده',
  render(container) {
    function parseMD(md) {
      let html = md
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/~~(.+?)~~/g, '<del>$1</del>')
        .replace(/`([^`]+)`/g, '<code style="background:var(--glass2);padding:2px 5px;border-radius:3px">$1</code>')
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent)">$1</a>')
        .replace(/^> (.+)$/gm, '<blockquote style="border-right:3px solid var(--accent);padding-right:10px;color:var(--text2)">$1</blockquote>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>');
      // Code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre style="background:var(--glass2);padding:10px;border-radius:6px;overflow-x:auto;direction:ltr"><code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
      });
      return '<p>' + html + '</p>';
    }

    container.innerHTML = `
      <div class="tool-section">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:300px">
          <div>
            <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">ویرایشگر</div>
            <textarea id="mdInput" class="input" style="height:300px;font-family:monospace;direction:ltr" placeholder="Markdown خود را اینجا بنویسید..."></textarea>
          </div>
          <div>
            <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">پیش‌نمایش</div>
            <div id="mdPreview" style="height:300px;overflow-y:auto;padding:10px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);direction:rtl"></div>
          </div>
        </div>
        <button class="btn btn-accent" id="mdCopyHTML" style="margin-top:8px">📋 کپی HTML</button>
      </div>`;
    const input = container.querySelector('#mdInput');
    const preview = container.querySelector('#mdPreview');
    input.oninput = () => { preview.innerHTML = parseMD(input.value); };
    container.querySelector('#mdCopyHTML').onclick = () => {
      navigator.clipboard.writeText(parseMD(input.value));
      showToast('HTML کپی شد ✅');
    };
  }

  desc: 'درام پد ۱۶ تایی با صداهای مختلف',
  render(container) {
    const pads = [
      { key: 'Q', label: 'Kick', freq: 60, type: 'sine', dur: 0.3 },
      { key: 'W', label: 'Snare', freq: 200, type: 'triangle', dur: 0.15 },
      { key: 'E', label: 'HiHat', freq: 800, type: 'square', dur: 0.05 },
      { key: 'R', label: 'OpenHH', freq: 800, type: 'square', dur: 0.2 },
      { key: 'A', label: 'Tom 1', freq: 120, type: 'sine', dur: 0.25 },
      { key: 'S', label: 'Tom 2', freq: 100, type: 'sine', dur: 0.25 },
      { key: 'D', label: 'Tom 3', freq: 80, type: 'sine', dur: 0.3 },
      { key: 'F', label: 'Clap', freq: 400, type: 'triangle', dur: 0.1 },
      { key: 'Z', label: 'Rim', freq: 300, type: 'square', dur: 0.08 },
      { key: 'X', label: 'Cowbell', freq: 560, type: 'square', dur: 0.15 },
      { key: 'C', label: 'Cymbal', freq: 1200, type: 'sawtooth', dur: 0.4 },
      { key: 'V', label: 'Crash', freq: 1500, type: 'sawtooth', dur: 0.5 },
      { key: '1', label: 'Shaker', freq: 6000, type: 'square', dur: 0.05 },
      { key: '2', label: 'Conga', freq: 250, type: 'sine', dur: 0.2 },
      { key: '3', label: 'Bongo', freq: 350, type: 'triangle', dur: 0.15 },
      { key: '4', label: 'Agogo', freq: 700, type: 'square', dur: 0.1 },
    ];

    let ctx = null;
    function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }

    function playPad(pad, el) {
      const ac = getCtx();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = pad.type;
      osc.frequency.setValueAtTime(pad.freq, ac.currentTime);
      // Add noise-like effect for snare/hihat
      if (pad.freq > 300) {
        osc.frequency.setValueAtTime(pad.freq + Math.random() * 200, ac.currentTime);
      }
      gain.gain.setValueAtTime(0.5, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + pad.dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(); osc.stop(ac.currentTime + pad.dur);
      if (el) { el.style.opacity = '0.6'; setTimeout(() => el.style.opacity = '1', 100); }
    }

    let html = '<div class="tool-section"><div class="drum-grid">';
    pads.forEach((p, i) => {
      html += `<button class="drum-pad" data-idx="${i}" title="${p.key}">${p.key}<br><span style="font-size:.6rem">${p.label}</span></button>`;
    });
    html += '</div><div style="text-align:center;font-size:.7rem;color:var(--text2);margin-top:8px">از کیبورد یا کلیک استفاده کنید</div></div>';
    container.innerHTML = html;

    const padEls = container.querySelectorAll('.drum-pad');
    padEls.forEach((el, i) => el.onclick = () => playPad(pads[i], el));

    function onKey(e) {
      const idx = pads.findIndex(p => p.key === e.key.toUpperCase());
      if (idx >= 0) { playPad(pads[idx], padEls[idx]); e.preventDefault(); }
    }
    document.addEventListener('keydown', onKey);
    // Cleanup on navigation (best effort)
    container._cleanup = () => document.removeEventListener('keydown', onKey);
  }
};

// 11. Speech to Text — صدا به متن

const speechTool = {
  id: 'other-speech', name: 'صدا به متن', icon: '🎤', category: 'other',
  keywords: ['صدا', 'speech', 'متن', 'ضبط', 'voice'],
  desc: 'تبدیل گفتار به متن',
  render(container) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const supported = !!SpeechRecognition;

    container.innerHTML = `
      <div class="tool-section">
        ${!supported ? '<div style="color:var(--danger);padding:10px;text-align:center">⚠️ مرورگر شما از این قابلیت پشتیبانی نمی‌کند</div>' : ''}
        ${field('زبان', `<select id="sttLang" class="input" ${!supported ? 'disabled' : ''}>
          <option value="fa-IR">فارسی</option><option value="en-US">انگلیسی</option>
          <option value="ar-SA">عربی</option><option value="de-DE">آلمانی</option>
          <option value="fr-FR">فرانسوی</option><option value="es-ES">اسپانیایی</option>
          <option value="tr-TR">ترکی</option><option value="ja-JP">ژاپنی</option>
          <option value="zh-CN">چینی</option><option value="ko-KR">کره‌ای</option>
        </select>`)}
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <button class="btn btn-accent" id="sttStart" ${!supported ? 'disabled' : ''}>🎙️ شروع</button>
          <button class="btn btn-ghost" id="sttStop" disabled>⏹️ توقف</button>
        </div>
        ${field('متن تشخیص داده شده', '<textarea id="sttOut" class="input" rows="5" readonly placeholder="پس از شروع صحبت کنید..."></textarea>')}
        <button class="btn btn-ghost" id="sttCopy">📋 کپی متن</button>
      </div>`;
    if (!supported) return;

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    const out = container.querySelector('#sttOut');
    const startBtn = container.querySelector('#sttStart');
    const stopBtn = container.querySelector('#sttStop');
    let finalText = '';

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      out.value = finalText + interim;
    };
    recognition.onend = () => { startBtn.disabled = false; stopBtn.disabled = true; };

    startBtn.onclick = () => {
      recognition.lang = container.querySelector('#sttLang').value;
      finalText = ''; out.value = '';
      recognition.start();
      startBtn.disabled = true; stopBtn.disabled = false;
      showToast('ضبط شروع شد 🎙️');
    };
    stopBtn.onclick = () => { recognition.stop(); showToast('ضبط متوقف شد'); };
    container.querySelector('#sttCopy').onclick = () => {
      if (out.value) { navigator.clipboard.writeText(out.value); showToast('کپی شد ✅'); }
    };
  }
};

// 12. Text to Speech — متن به صدا

const ttsTool = {
  id: 'other-tts', name: 'متن به صدا', icon: '🔊', category: 'other',
  keywords: ['صدا', 'tts', 'متن', 'خواندن', 'speech'],
  desc: 'تبدیل متن به گفتار',
  render(container) {
    const synth = window.speechSynthesis;
    if (!synth) {
      container.innerHTML = '<div class="tool-section"><p style="text-align:center;color:var(--text2)">مرورگر شما از تبدیل متن به صدا پشتیبانی نمیکند</p></div>';
      return;
    }
    container.innerHTML = `
      <div class="tool-section">
        ${field('متن', '<textarea id="ttsText" class="input" rows="4" placeholder="متنی وارد کنید..."></textarea>')}
        ${field('زبان', `<select id="ttsLang" class="input">
          <option value="fa-IR">فارسی</option><option value="en-US">انگلیسی</option>
          <option value="ar-SA">عربی</option><option value="de-DE">آلمانی</option>
          <option value="fr-FR">فرانسوی</option><option value="es-ES">اسپانیایی</option>
          <option value="ja-JP">ژاپنی</option><option value="zh-CN">چینی</option>
        </select>`)}
        ${field('صدا', '<select id="ttsVoice" class="input"></select>')}
        ${field('سرعت', '<div style="display:flex;align-items:center;gap:8px"><input type="range" id="ttsRate" min="0.5" max="2" step="0.1" value="1" style="flex:1"><span id="ttsRateVal">1x</span></div>')}
        ${field('زیر و بمی', '<div style="display:flex;align-items:center;gap:8px"><input type="range" id="ttsPitch" min="0" max="2" step="0.1" value="1" style="flex:1"><span id="ttsPitchVal">1</span></div>')}
        <div style="display:flex;gap:6px">
          <button class="btn btn-accent" id="ttsPlay">▶️ پخش</button>
          <button class="btn btn-ghost" id="ttsStop">⏹️ توقف</button>
        </div>
      </div>`;
    const voiceSelect = container.querySelector('#ttsVoice');
    const rateIn = container.querySelector('#ttsRate');
    const pitchIn = container.querySelector('#ttsPitch');
    rateIn.oninput = () => container.querySelector('#ttsRateVal').textContent = rateIn.value + 'x';
    pitchIn.oninput = () => container.querySelector('#ttsPitchVal').textContent = pitchIn.value;

    let voices = [];
    function loadVoices() {
      voices = synth.getVoices();
      const lang = container.querySelector('#ttsLang').value;
      voiceSelect.innerHTML = '';
      const filtered = voices.filter(v => v.lang.startsWith(lang.split('-')[0]));
      (filtered.length ? filtered : voices).forEach((v, i) => {
        voiceSelect.innerHTML += `<option value="${i}">${v.name} (${v.lang})</option>`;
      });
    }
    synth.onvoiceschanged = loadVoices;
    loadVoices();
    container.querySelector('#ttsLang').onchange = loadVoices;

    container.querySelector('#ttsPlay').onclick = () => {
      const text = container.querySelector('#ttsText').value.trim();
      if (!text) return showToast('متنی وارد کنید');
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = container.querySelector('#ttsLang').value;
      u.rate = parseFloat(rateIn.value);
      u.pitch = parseFloat(pitchIn.value);
      const vi = parseInt(voiceSelect.value);
      if (voices[vi]) u.voice = voices[vi];
      synth.speak(u);
    };
    container.querySelector('#ttsStop').onclick = () => synth.cancel();
  }
};

// 14. Meme Generator — میم ساز
// ═══════════════════════════════════════════
const memeTool = {
  id: 'other-meme', name: 'میم ساز', icon: '😂', category: 'other',
  keywords: ['میم', 'meme', 'تصویر', 'خنده', 'mememaker'],
  desc: 'ساخت تصاویر میم با قالب‌های محبوب',
  render(container) {
    const templates = [
      { id: 'distracted', name: 'دیستراکچر بوی', desc: 'متن بالا / متن پایین' },
      { id: 'drake', name: 'دراکه', desc: 'دو پنل: رد / تأیید' },
      { id: 'change', name: 'چنج مای مایند', desc: 'پروانه و شخص' },
      { id: 'expectation', name: 'اکسپکشن واقعیت', desc: 'انتظار در برابر واقعیت' },
    ];
    const tOpts = templates.map(t => `<option value="${t.id}">${t.name} — ${t.desc}</option>`).join('');

    container.innerHTML = `
      <div class="tool-section">
        ${field('قالب میم', `<select id="memeTpl" class="input">${tOpts}</select>`)}
        ${field('متن بالا', '<input id="memeTop" class="input" placeholder="متن بالای تصویر">')}
        ${field('متن پایین', '<input id="memeBottom" class="input" placeholder="متن پایین تصویر">')}
        ${field('اندازه فونت', '<div style="display:flex;align-items:center;gap:8px"><input type="range" id="memeFont" min="16" max="64" value="32" style="flex:1"><span id="memeFontVal">32</span></div>')}
        ${field('رنگ متن', '<input type="color" id="memeColor" value="#ffffff" style="width:50px;height:32px;border:none;cursor:pointer">')}
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <button class="btn btn-accent" id="memeGen">🎨 ساخت میم</button>
          <button class="btn btn-ghost" id="memeDl">💾 دانلود PNG</button>
        </div>
        <canvas id="memeCanvas" width="600" height="400" style="width:100%;max-width:600px;border:1px solid var(--border);border-radius:8px;display:block;margin:0 auto;background:#222"></canvas>
      </div>`;

    const canvas = container.querySelector('#memeCanvas');
    const ctx = canvas.getContext('2d');
    const tplSel = container.querySelector('#memeTpl');
    const topIn = container.querySelector('#memeTop');
    const bottomIn = container.querySelector('#memeBottom');
    const fontIn = container.querySelector('#memeFont');
    const fontVal = container.querySelector('#memeFontVal');
    const colorIn = container.querySelector('#memeColor');

    fontIn.oninput = () => fontVal.textContent = fontIn.value;

    function drawMeme() {
      const W = canvas.width, H = canvas.height;
      const tpl = tplSel.value;
      const fontSize = parseInt(fontIn.value);
      const textColor = colorIn.value;
      const topText = topIn.value.trim();
      const bottomText = bottomIn.value.trim();

      ctx.clearRect(0, 0, W, H);

      function drawOutlinedText(text, x, y, maxWidth) {
        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.lineWidth = fontSize / 6;
        ctx.strokeStyle = '#000000';
        ctx.fillStyle = textColor;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y, maxWidth);
        ctx.fillText(text, x, y, maxWidth);
      }

      if (tpl === 'distracted') {
        // Background: warm gradient
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#2d1b69'); grad.addColorStop(1, '#11998e');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
        // Draw a simple figure silhouette
        ctx.fillStyle = '#ffffff22';
        ctx.beginPath(); ctx.ellipse(W / 2, H / 2 + 40, 80, 60, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(W / 2 - 25, H / 2 - 20, 50, 80);
        // Red herring
        ctx.fillStyle = '#ff475722';
        ctx.beginPath(); ctx.ellipse(W * 0.75, H / 2 + 20, 40, 50, 0, 0, Math.PI * 2); ctx.fill();
        // Text
        if (topText) drawOutlinedText(topText, W / 2, fontSize + 20, W - 40);
        if (bottomText) drawOutlinedText(bottomText, W / 2, H - 20, W - 40);

      } else if (tpl === 'drake') {
        // Two panels
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
        // Divider
        ctx.fillStyle = '#ffffff11';
        ctx.fillRect(0, 0, W, H / 2);
        // Reject panel (top)
        ctx.fillStyle = '#e74c3c22';
        ctx.fillRect(10, 10, W - 20, H / 2 - 15);
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
        ctx.fillText('✗', 50, H / 4 + 8);
        // Approve panel (bottom)
        ctx.fillStyle = '#2ecc7122';
        ctx.fillRect(10, H / 2 + 5, W - 20, H / 2 - 15);
        ctx.fillStyle = '#2ecc71';
        ctx.fillText('✓', 50, H * 3 / 4 + 8);
        // Text in panels
        const panelFontSize = Math.max(16, fontSize - 6);
        ctx.font = `bold ${panelFontSize}px Arial, sans-serif`;
        ctx.fillStyle = textColor; ctx.textAlign = 'center';
        if (topText) {
          ctx.lineWidth = panelFontSize / 6; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
          ctx.strokeText(topText, W / 2 + 20, H / 4 + 8, W - 120);
          ctx.fillText(topText, W / 2 + 20, H / 4 + 8, W - 120);
        }
        if (bottomText) {
          ctx.strokeText(bottomText, W / 2 + 20, H * 3 / 4 + 8, W - 120);
          ctx.fillText(bottomText, W / 2 + 20, H * 3 / 4 + 8, W - 120);
        }

      } else if (tpl === 'change') {
        // Guy presenting butterfly
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#0f2027'); grad.addColorStop(0.5, '#203a43'); grad.addColorStop(1, '#2c5364');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
        // Simple figure
        ctx.fillStyle = '#ffffff33';
        // Head
        ctx.beginPath(); ctx.ellipse(W * 0.3, H * 0.35, 25, 25, 0, 0, Math.PI * 2); ctx.fill();
        // Body
        ctx.fillRect(W * 0.3 - 15, H * 0.35 + 25, 30, 60);
        // Arms pointing
        ctx.beginPath(); ctx.moveTo(W * 0.3 + 15, H * 0.35 + 40);
        ctx.lineTo(W * 0.3 + 70, H * 0.35 + 20); ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff33'; ctx.stroke();
        // Butterfly
        ctx.fillStyle = '#f39c1266';
        ctx.beginPath(); ctx.ellipse(W * 0.65, H * 0.3, 30, 20, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(W * 0.65, H * 0.3, 30, 20, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e74c3c44';
        ctx.beginPath(); ctx.ellipse(W * 0.65, H * 0.35, 20, 15, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(W * 0.65, H * 0.35, 20, 15, 0.3, 0, Math.PI * 2); ctx.fill();
        // Labels
        ctx.font = 'bold 18px Arial'; ctx.fillStyle = '#ffffff88'; ctx.textAlign = 'center';
        ctx.fillText('؟', W * 0.65, H * 0.3 + 5);
        // Text
        if (topText) drawOutlinedText(topText, W / 2, fontSize + 20, W - 40);
        if (bottomText) drawOutlinedText(bottomText, W / 2, H - 20, W - 40);

      } else if (tpl === 'expectation') {
        // Two columns: expectation vs reality
        ctx.fillStyle = '#16213e'; ctx.fillRect(0, 0, W, H);
        // Divider
        ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(W / 2, 10); ctx.lineTo(W / 2, H - 10); ctx.stroke();
        // Labels
        ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
        ctx.fillStyle = '#2ecc71'; ctx.fillText('انتظار ✨', W / 4, 30);
        ctx.fillStyle = '#e74c3c'; ctx.fillText('واقعیت 💀', W * 3 / 4, 30);
        // Expectation side: beautiful gradient
        const expGrad = ctx.createLinearGradient(0, 40, W / 2, H);
        expGrad.addColorStop(0, '#a29bfe'); expGrad.addColorStop(1, '#6c5ce7');
        ctx.fillStyle = expGrad;
        ctx.fillRect(5, 40, W / 2 - 8, H - 50);
        // Reality side: dark and messy
        const realGrad = ctx.createLinearGradient(W / 2, 40, W, H);
        realGrad.addColorStop(0, '#2d3436'); realGrad.addColorStop(1, '#636e72');
        ctx.fillStyle = realGrad;
        ctx.fillRect(W / 2 + 3, 40, W / 2 - 8, H - 50);
        // Stars on expectation
        ctx.fillStyle = '#ffffff44';
        for (let i = 0; i < 8; i++) {
          const sx = 30 + Math.random() * (W / 2 - 60);
          const sy = 60 + Math.random() * (H - 120);
          ctx.fillText('⭐', sx, sy);
        }
        // Broken on reality
        ctx.fillStyle = '#ffffff22';
        ctx.fillText('💔', W * 3 / 4, H / 2);
        // Text
        const halfFontSize = Math.max(14, fontSize - 8);
        ctx.font = `bold ${halfFontSize}px Arial, sans-serif`;
        ctx.fillStyle = textColor; ctx.textAlign = 'center';
        ctx.lineWidth = halfFontSize / 6; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
        if (topText) {
          ctx.strokeText(topText, W / 4, H - 30, W / 2 - 30);
          ctx.fillText(topText, W / 4, H - 30, W / 2 - 30);
        }
        if (bottomText) {
          ctx.strokeText(bottomText, W * 3 / 4, H - 30, W / 2 - 30);
          ctx.fillText(bottomText, W * 3 / 4, H - 30, W / 2 - 30);
        }
      }
    }

    tplSel.onchange = drawMeme;
    topIn.oninput = drawMeme;
    bottomIn.oninput = drawMeme;

            <button class="btn btn-accent" id="toiDl">💾 دانلود PNG</button>
          </div>
          <div>
            <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">پیش‌نمایش</div>
            <canvas id="toiCanvas" width="600" height="400" style="width:100%;border:1px solid var(--border);border-radius:8px;background:#1a1a2e"></canvas>

    const canvas = container.querySelector('#toiCanvas');
    const ctx = canvas.getContext('2d');
    const fileIn = container.querySelector('#toiFile');
    const fontSel = container.querySelector('#toiFont');
    const sizeIn = container.querySelector('#toiSize');
    const sizeVal = container.querySelector('#toiSizeVal');
    const colorIn = container.querySelector('#toiColor');
    const xIn = container.querySelector('#toiX');
    const xVal = container.querySelector('#toiXVal');
    const yIn = container.querySelector('#toiY');
    const yVal = container.querySelector('#toiYVal');
    const boldIn = container.querySelector('#toiBold');
    const italicIn = container.querySelector('#toiItalic');
    const shadowIn = container.querySelector('#toiShadow');
    const textIn = container.querySelector('#toiText');

    let bgImage = null;
    let bgColor = '#1a1a2e';

    // Color swatches
    container.querySelectorAll('.toi-bg-opt').forEach(el => {
      el.onclick = () => {
        container.querySelectorAll('.toi-bg-opt').forEach(e => e.style.borderColor = 'transparent');
        el.style.borderColor = 'var(--accent)';
        bgColor = el.dataset.color;
        bgImage = null;
        renderPreview();
      };
    });
    // Select first color by default
    container.querySelector('.toi-bg-opt').style.borderColor = 'var(--accent)';

    fileIn.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          renderPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    sizeIn.oninput = () => { sizeVal.textContent = sizeIn.value; renderPreview(); };
    xIn.oninput = () => { xVal.textContent = xIn.value + '%'; renderPreview(); };
    yIn.oninput = () => { yVal.textContent = yIn.value + '%'; renderPreview(); };
    fontSel.onchange = renderPreview;
    colorIn.oninput = renderPreview;
    boldIn.onchange = renderPreview;
    italicIn.onchange = renderPreview;
    shadowIn.onchange = renderPreview;
    textIn.oninput = renderPreview;

    function renderPreview() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Background
      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, W, H);
      } else {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, W, H);
      }

      // Text
      const text = textIn.value;
      if (!text) return;

      const fontSize = parseInt(sizeIn.value);
      const fontStyle = italicIn.checked ? 'italic ' : '';
      const fontWeight = boldIn.checked ? 'bold ' : '';
      ctx.font = `${fontStyle}${fontWeight}${fontSize}px ${fontSel.value}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const x = (parseInt(xIn.value) / 100) * W;
      const y = (parseInt(yIn.value) / 100) * H;

      // Shadow
      if (shadowIn.checked) {
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = fontSize / 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }

      ctx.fillStyle = colorIn.value;
      // Support multiline
      const lines = text.split('\n');
      const lineHeight = fontSize * 1.3;
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, x, startY + i * lineHeight, W - 40);
      });

      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    container.querySelector('#toiDl').onclick = () => {
      const a = document.createElement('a'); a.download = 'text-on-image.png'; a.href = canvas.toDataURL(); a.click();
      showToast('دانلود شد ✅');
    };

    renderPreview();
  }
};

// ─────────────────────────────────────────────
// 1. prod-pomodoro — Pomodoro Timer 🍅
// ─────────────────────────────────────────────
const pomodoroTool = {
  id: 'prod-pomodoro',
  name: 'Pomodoro Timer',
  icon: '🍅',
  category: 'productivity',
  keywords: ['timer', 'pomodoro', 'focus', 'work', 'break', 'زمان‌سنج'],
  desc: 'زمان‌سنج پومودورو با چرخه کار و استراحت',
  render(container) {
    const STATE_KEY = 'pomodoro_state';
    let settings = { work: 25, shortBreak: 5, longBreak: 15 };
    let mode = 'work'; // work | shortBreak | longBreak
    let timeLeft = settings.work * 60;
    let interval = null;
    let running = false;
    let sessions = 0;

    // Load saved state
    try {
      const saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
      if (saved.settings) settings = { ...settings, ...saved.settings };
      if (typeof saved.sessions === 'number') sessions = saved.sessions;
    } catch {}

    function saveState() {
      localStorage.setItem(STATE_KEY, JSON.stringify({ settings, sessions }));
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.type = 'sine';
          osc2.frequency.value = 1100;
          gain2.gain.value = 0.3;
          osc2.start();
          osc2.stop(ctx.currentTime + 0.3);
          setTimeout(() => ctx.close(), 500);
        }, 400);
      } catch {}
    }

    function fmt(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function modeLabel() {
      if (mode === 'work') return 'کار';
      if (mode === 'shortBreak') return 'استراحت کوتاه';
      return 'استراحت بلند';
    }

    function renderUI() {
      container.innerHTML = `
        <div class="card" style="text-align:center;">
          <h3>🍅 پومودورو</h3>
          <div style="margin:12px 0; font-size:10px; color:#888;">
            جلسه: ${sessions + 1} — ${modeLabel()}
          </div>
          <div id="pomo-display" style="font-size:64px; font-weight:bold; font-family:monospace; color:${mode === 'work' ? '#e74c3c' : '#27ae60'}; margin:20px 0;">
            ${fmt(timeLeft)}
          </div>
          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
            <button class="btn" id="pomo-start">${running ? '⏸ مکث' : '▶ شروع'}</button>
            <button class="btn" id="pomo-reset">⟲ بازنشانی</button>
          </div>
          <div style="margin-top:16px;">
            <details>
              <summary style="cursor:pointer; color:#888;">⚙️ تنظیمات</summary>
              <div class="input-group" style="margin-top:8px;">
                <label>کار (دقیقه): <input type="number" id="pomo-work" value="${settings.work}" min="1" max="90" style="width:60px;"></label>
              </div>
              <div class="input-group">
                <label>استراحت کوتاه: <input type="number" id="pomo-short" value="${settings.shortBreak}" min="1" max="30" style="width:60px;"></label>
              </div>
              <div class="input-group">
                <label>استراحت بلند: <input type="number" id="pomo-long" value="${settings.longBreak}" min="1" max="60" style="width:60px;"></label>

            </details>
          </div>
        </div>`;

      const display = container.querySelector('#pomo-display');

      container.querySelector('#pomo-start').onclick = () => {
        if (running) {
          clearInterval(interval);
          running = false;
        } else {
          running = true;
          interval = setInterval(() => {
            timeLeft--;
            display.textContent = fmt(timeLeft);
            if (timeLeft <= 0) {
              clearInterval(interval);
              running = false;
              beep();
              showToast(`🍅 ${modeLabel()} تمام شد!`, 'success');
              if (mode === 'work') {
                sessions++;
                saveState();
                mode = sessions % 4 === 0 ? 'longBreak' : 'shortBreak';
              } else {
                mode = 'work';
              }
              timeLeft = settings[mode === 'shortBreak' ? 'shortBreak' : mode === 'longBreak' ? 'longBreak' : 'work'] * 60;
              renderUI();
            }
          }, 1000);
        }
        renderUI();
      };

      container.querySelector('#pomo-reset').onclick = () => {
        clearInterval(interval);
        running = false;
        mode = 'work';
        timeLeft = settings.work * 60;
        renderUI();
      };

      container.querySelector('#pomo-save-settings')?.addEventListener('click', () => {
        settings.work = parseInt(container.querySelector('#pomo-work').value) || 25;
        settings.shortBreak = parseInt(container.querySelector('#pomo-short').value) || 5;
        settings.longBreak = parseInt(container.querySelector('#pomo-long').value) || 15;
        saveState();
        clearInterval(interval);
        running = false;
        mode = 'work';
        timeLeft = settings.work * 60;
        showToast('تنظیمات ذخیره شد ✓');
        renderUI();
      });
    }

    renderUI();
  }
};

const sleepTool = {
  id: 'prod-sleep',
  name: 'محاسبه خواب',
  icon: '😴',
  category: 'productivity',
  keywords: ['sleep', 'wake', 'cycle', 'خواب', 'بیدار', 'چرخه'],
  desc: 'محاسبه زمان بهینه خواب بر اساس چرخه ۹۰ دقیقه‌ای',
  render(container) {
    const FALL_ASLEEP = 14; // minutes
    const CYCLE = 90; // minutes
    let mode = 'wake'; // wake = "when to wake", sleep = "when to sleep"

    function addMinutes(h, m, add) {
      const total = h * 60 + m + add;
      return { h: Math.floor(total / 60) % 24, m: total % 60 };
    }

    function fmtTime(h, m) {
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function getCycles(baseH, baseM, direction) {
      const cycles = [];
      for (let i = 6; i >= 3; i--) {
        const offset = direction === 'back'
          ? -(i * CYCLE + FALL_ASLEEP)
          : (i * CYCLE + FALL_ASLEEP);
        const t = addMinutes(baseH, baseM, offset);
        cycles.push({ time: fmtTime(t.h, t.m), count: i, hours: ((i * CYCLE) / 60).toFixed(1) });
      }
      return cycles;
    }

    function renderUI() {
      const now = new Date();
      const suggestions = mode === 'wake'
        ? getCycles(now.getHours(), now.getMinutes(), 'forward')
        : (() => {
            // For "sleep" mode, user picks a wake time
            return null;
          })();

      container.innerHTML = `
        <div class="card">
          <h3>😴 محاسبه خواب</h3>
          <div style="display:flex; gap:8px; margin-bottom:16px;">
            <button class="btn ${mode === 'wake' ? '' : 'btn-outline'}" id="sleep-mode-wake">⏰ زمان بیدار شدن</button>
            <button class="btn ${mode === 'sleep' ? '' : 'btn-outline'}" id="sleep-mode-sleep">🛏️ زمان خوابیدن</button>
          </div>
          ${mode === 'wake' ? `
            <p style="color:#666; margin-bottom:12px;">اگر الان بخوابید، بهترین زمان‌ها برای بیدار شدن:</p>
            <div style="display:grid; gap:8px;">
              ${suggestions.map((s, i) => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:12px; background:${i === 0 ? '#e8f5e9' : '#f5f5f5'}; border-radius:8px; ${i === 0 ? 'border:2px solid #4caf50;' : ''}">
                  <div>
                    <div style="font-size:28px; font-weight:bold; font-family:monospace;">${s.time}</div>
                    <div style="font-size:12px; color:#888;">${s.count} چرخه — ${s.hours} ساعت خواب</div>
                  </div>
                  ${i === 0 ? '<span style="color:#4caf50; font-size:13px;">⭐ بهترین</span>' : ''}
                </div>
              `).join('')}
            </div>
            <p style="margin-top:16px; font-size:12px; color:#aaa; text-align:center;">
              زمان فعلی: ${fmtTime(now.getHours(), now.getMinutes())} — زمان به خواب رفتن + ${FALL_ASLEEP} دقیقه لحاظ شده
            </p>
          ` : `
            <div class="input-group">
              <label>ساعت بیدار شدن مورد نظر:</label>
              <input type="time" id="sleep-wake-time" value="07:00" />
            </div>
            <div id="sleep-results" style="margin-top:12px;"></div>
          `}
        </div>`;

      container.querySelector('#sleep-mode-wake').onclick = () => { mode = 'wake'; renderUI(); };
      container.querySelector('#sleep-mode-sleep').onclick = () => { mode = 'sleep'; renderUI(); };

      if (mode === 'sleep') {
        const timeInput = container.querySelector('#sleep-wake-time');
        function showSleepTimes() {
          const [h, m] = timeInput.value.split(':').map(Number);
          const cycles = getCycles(h, m, 'back');
          const resultsDiv = container.querySelector('#sleep-results');
          resultsDiv.innerHTML = `
            <p style="color:#666; margin-bottom:12px;">برای بیدار شدن در ${fmtTime(h, m)}، باید در یکی از این زمان‌ها بخوابید:</p>
            <div style="display:grid; gap:8px;">
              ${cycles.map((s, i) => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:12px; background:${i === 0 ? '#e3f2fd' : '#f5f5f5'}; border-radius:8px; ${i === 0 ? 'border:2px solid #2196f3;' : ''}">
                  <div>
                    <div style="font-size:28px; font-weight:bold; font-family:monospace;">${s.time}</div>
                    <div style="font-size:12px; color:#888;">${s.count} چرخه — ${s.hours} ساعت خواب</div>
                  </div>
                  ${i === 0 ? '<span style="color:#2196f3; font-size:13px;">⭐ بهترین</span>' : ''}
                </div>
              `).join('')}
            </div>`;
        }
        timeInput.onchange = showSleepTimes;
        showSleepTimes();
      }
    }

    renderUI();
  }
};

          <p style="margin-top:12px; font-size:11px; color:#aaa; text-align:center;">
            هر دقیقه بررسی می‌شود — اعلان‌ها پس از یک بار نمایش تا روز بعد غیرفعال می‌شوند

const calendarTool = {

  desc: 'تقویم شمسی با مناسبت‌ها و تعطیلات ملی و مذهبی',
  render(container) {
    // Jalali conversion helpers
    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
      let jy = -1595 + 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
      let jm, jd;
      if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
      else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
      return [jy, jm, jd];
    }

    function jalaliToGregorian(jy, jm, jd) {
      jy += 1595;
      let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
      let gy = 400 * Math.floor(days / 146097);
      days %= 146097;
      if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
      gy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
      const gd = days + 1;
      const sal_a = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let gm;
      for (gm = 0; gm < 13 && gd > sal_a[gm]; gm++) { /* noop */ }
      return [gy, gm, gd - sal_a[gm - 1]];
    }

    function jalaliMonthLength(jy, jm) {

// 8. prod-habit — ترکر عادت روزانه ✅
// ─────────────────────────────────────────────
const habitTool = {
  id: 'prod-habit',
  name: 'ترکر عادت',
  icon: '✅',
  category: 'productivity',
  keywords: ['habit', 'streak', 'tracker', 'daily', 'عادت', 'پیگیری', 'روزانه'],
  desc: 'پیگیری عادت‌های روزانه با نمایش رکورد و تقویم',
  render(container) {
    const STORAGE_KEY = 'habit_tracker';
    let habits = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let viewMonth = null; // null = current month

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(habits)); }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function dateStr(year, month, day) {
      return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    function toggleHabit(id) {
      const h = habits.find(x => x.id === id);
      if (!h) return;
      const t = todayStr();
      const idx = h.days.indexOf(t);
      if (idx >= 0) h.days.splice(idx, 1);
      else h.days.push(t);
      save();
      renderUI();
    }

    function streakInfo(h) {
      if (!h.days.length) return { current: 0, best: 0 };
      const sorted = [...h.days].sort().reverse();
      let current = 0;
      let best = 0;
      let streak = 0;
      let prev = null;
      for (const d of sorted) {
        const date = new Date(d);
        if (prev) {
          const diff = (prev - date) / 86400000;
          if (diff === 1) streak++;
          else streak = 1;
        } else {
          streak = 1;
        }
        if (streak > best) best = streak;
        prev = date;
      }
      // Current streak: count from today backwards
      current = 0;
      const check = new Date();
      for (let i = 0; i < 365; i++) {
        const ds = dateStr(check.getFullYear(), check.getMonth()+1, check.getDate());
        if (h.days.includes(ds)) { current++; check.setDate(check.getDate() - 1); }
        else break;
      }
      return { current, best };
    }

    function renderUI() {
      const now = new Date();
      const vm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
      const daysInMonth = new Date(vm.y, vm.m, 0).getDate();
      const today = todayStr();

      container.innerHTML = `
        <div class="card">
          <h3>✅ ترکر عادت روزانه</h3>
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <input type="text" id="habit-name" placeholder="نام عادت..." style="flex:1;" />
            <input type="text" id="habit-icon" placeholder="ایموجی" value="💪" style="width:60px; text-align:center;" />
            <button class="btn" id="habit-add">افزودن</button>
          </div>
          <div style="display:flex; gap:8px; margin-bottom:12px; align-items:center; justify-content:center;">
            <button class="btn" id="habit-prev-m" style="padding:2px 10px;">◀</button>
            <span style="font-weight:bold;">${MONTHS_FA[vm.m]} ${vm.y}</span>
            <button class="btn" id="habit-next-m" style="padding:2px 10px;">▶</button>
            <button class="btn" id="habit-today" style="font-size:11px; padding:2px 8px;">امروز</button>
          </div>
          <div id="habit-list">
            ${habits.length === 0 ? '<p style="color:#888; text-align:center;">عادتی اضافه نشده</p>' : ''}
            ${habits.map(h => {
              const { current, best } = streakInfo(h);
              const doneToday = h.days.includes(today);
              let gridHTML = '';
              for (let d = 1; d <= daysInMonth; d++) {
                const ds = dateStr(vm.y, vm.m, d);
                const done = h.days.includes(ds);
                const isFuture = new Date(ds) > new Date(today);
                gridHTML += `<div title="${ds}" style="width:18px; height:18px; border-radius:3px; background:${done ? '#4caf50' : isFuture ? '#f5f5f5' : '#eee'}; ${isFuture ? 'opacity:0.3;' : ''}"></div>`;
              }
              return `
                <div style="margin-bottom:16px; padding:12px; background:#fafafa; border-radius:12px; border:1px solid #eee;">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <button class="btn" data-habit-toggle="${h.id}" style="font-size:24px; padding:6px 10px; background:${doneToday ? '#4caf50' : '#f0f0f0'}; color:${doneToday ? '#fff' : '#333'}; border-radius:12px;">
                      ${h.icon}
                    </button>
                    <div style="flex:1;">
                      <div style="font-weight:bold; font-size:16px;">${h.name}</div>
                      <div style="font-size:12px; color:#888;">🔥 ${current} روز فعلی — 🏆 ${best} بهترین</div>
                    </div>
                    <button class="btn" data-del-habit="${h.id}" style="padding:2px 8px; font-size:12px;">✕</button>
                  </div>
                  <div style="display:flex; flex-wrap:wrap; gap:3px; margin-top:10px;">
                    ${gridHTML}
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>`;

      const nameInput = container.querySelector('#habit-name');
      const iconInput = container.querySelector('#habit-icon');
      function addHabit() {
        const name = nameInput.value.trim();
        if (!name) return;
        const icon = iconInput.value.trim() || '💪';
        habits.push({ id: Date.now().toString(), name, icon, days: [] });
        save();
        renderUI();
      }
      container.querySelector('#habit-add').onclick = addHabit;
      nameInput.onkeydown = (e) => { if (e.key === 'Enter') addHabit(); };

      container.querySelector('#habit-prev-m').onclick = () => {
        const cm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
        let m = cm.m - 1, y = cm.y;
        if (m < 1) { m = 12; y--; }
        viewMonth = { y, m };
        renderUI();
      };
      container.querySelector('#habit-next-m').onclick = () => {
        const cm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
        let m = cm.m + 1, y = cm.y;
        if (m > 12) { m = 1; y++; }
        viewMonth = { y, m };
        renderUI();
      };
      container.querySelector('#habit-today').onclick = () => { viewMonth = null; renderUI(); };

      container.querySelectorAll('[data-habit-toggle]').forEach(btn => {
        btn.onclick = () => toggleHabit(btn.dataset.habitToggle);
      });
      container.querySelectorAll('[data-del-habit]').forEach(btn => {
        btn.onclick = () => {
          habits = habits.filter(h => h.id !== btn.dataset.delHabit);
          save();
          renderUI();
        };
      });
    }

    renderUI();
  }
};

  render(container) {
    const STORAGE_KEY = 'expense_data';
    let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let type = 'expense'; // expense | income
    let cat = 'food';
    let viewMonth = null;

    const categories = [
      { id: 'food', icon: '🍔', name: 'غذا' },
      { id: 'transport', icon: '🚗', name: 'حمل‌ونقل' },
      { id: 'housing', icon: '🏠', name: 'مسکن' },
      { id: 'entertainment', icon: '🎭', name: 'تفریح' },
      { id: 'education', icon: '📚', name: 'آموزش' },
      { id: 'health', icon: '💊', name: 'سلامت' },
      { id: 'clothing', icon: '👕', name: 'پوشاک' },
      { id: 'bills', icon: '📱', name: 'قبض' },
      { id: 'gift', icon: '🎁', name: 'هدیه' },
      { id: 'other', icon: '📦', name: 'سایر' },
    ];

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); }

    function todayDate() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getMonthTx() {
      const now = new Date();
      const vm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
      return transactions.filter(t => {
        const d = new Date(t.date);
        return d.getFullYear() === vm.y && d.getMonth() + 1 === vm.m;
      });
    }

    function renderUI() {
      const now = new Date();
      const vm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
      const monthTx = getMonthTx();
      const totalIncome = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const totalExpense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const balance = totalIncome - totalExpense;

      // Category breakdown
      const catBreakdown = {};
      monthTx.filter(t => t.type === 'expense').forEach(t => {
        catBreakdown[t.cat] = (catBreakdown[t.cat] || 0) + t.amount;
      });
      const maxCatVal = Math.max(...Object.values(catBreakdown), 1);

      // Daily expenses for bar chart
      const daysInMonth = new Date(vm.y, vm.m, 0).getDate();
      const dailyExp = {};
      monthTx.filter(t => t.type === 'expense').forEach(t => {
        const day = new Date(t.date).getDate();
        dailyExp[day] = (dailyExp[day] || 0) + t.amount;
      });
      const maxDaily = Math.max(...Object.values(dailyExp), 1);

      container.innerHTML = `
        <div class="card">
          <h3>💰 مدیریت هزینه</h3>
          <div style="display:flex; gap:8px; margin-bottom:12px; align-items:center; justify-content:center;">
            <button class="btn" id="exp-prev-m" style="padding:2px 10px;">◀</button>
            <span style="font-weight:bold;">${MONTHS_FA[vm.m]} ${vm.y}</span>
            <button class="btn" id="exp-next-m" style="padding:2px 10px;">▶</button>
          </div>
          <!-- Balance -->
          <div style="display:flex; gap:12px; margin-bottom:16px; text-align:center;">
            <div style="flex:1; padding:12px; background:#e8f5e9; border-radius:10px;">
              <div style="font-size:12px; color:#666;">درآمد</div>
              <div style="font-size:18px; font-weight:bold; color:#2e7d32;">${totalIncome.toLocaleString()} ت</div>
            </div>
            <div style="flex:1; padding:12px; background:#ffebee; border-radius:10px;">
              <div style="font-size:12px; color:#666;">هزینه</div>
              <div style="font-size:18px; font-weight:bold; color:#c62828;">${totalExpense.toLocaleString()} ت</div>
            </div>
            <div style="flex:1; padding:12px; background:${balance >= 0 ? '#e3f2fd' : '#fff3e0'}; border-radius:10px;">
              <div style="font-size:12px; color:#666;">مانده</div>
              <div style="font-size:18px; font-weight:bold; color:${balance >= 0 ? '#1565c0' : '#e65100'};">${balance.toLocaleString()} ت</div>
            </div>
          </div>
          <!-- Add form -->
          <div style="padding:12px; background:#f9f9f9; border-radius:10px; margin-bottom:16px;">
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <button class="btn ${type === 'expense' ? '' : 'btn-outline'}" id="exp-type-exp" style="flex:1;">💸 هزینه</button>
              <button class="btn ${type === 'income' ? '' : 'btn-outline'}" id="exp-type-inc" style="flex:1;">💵 درآمد</button>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
              ${categories.map(c => `<button class="btn ${cat === c.id ? '' : 'btn-outline'}" data-exp-cat="${c.id}" style="font-size:12px; padding:2px 6px;">${c.icon} ${c.name}</button>`).join('')}
            </div>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <input type="number" id="exp-amount" placeholder="مبلغ (تومان)" style="flex:1;" />
              <input type="date" id="exp-date" value="${todayDate()}" style="width:130px;" />
            </div>
            <div style="display:flex; gap:8px;">
              <input type="text" id="exp-desc" placeholder="توضیحات..." style="flex:1;" />
              <button class="btn" id="exp-add">افزودن</button>
            </div>
          </div>
          <!-- Daily bar chart -->
          <div style="margin-bottom:16px;">
            <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">📊 هزینه روزانه</div>
            <div style="display:flex; align-items:flex-end; gap:2px; height:80px; direction:ltr;">
              ${Array.from({length: daysInMonth}, (_, i) => i + 1).map(d => {
                const val = dailyExp[d] || 0;
                const h = maxDaily > 0 ? (val / maxDaily) * 70 : 0;
                return `<div title="${d}: ${val.toLocaleString()} ت" style="flex:1; display:flex; flex-direction:column; align-items:center;">
                  <div style="width:100%; max-width:20px; height:${Math.max(h, 2)}px; background:${val > 0 ? '#4caf50' : '#eee'}; border-radius:2px 2px 0 0;"></div>
                  <div style="font-size:8px; color:#999;">${d}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
          <!-- Category breakdown -->
          ${Object.keys(catBreakdown).length > 0 ? `
            <div style="margin-bottom:16px;">
              <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">📋 دسته‌بندی هزینه‌ها</div>
              ${Object.entries(catBreakdown).sort((a,b) => b[1] - a[1]).map(([cId, val]) => {
                const c = categories.find(x => x.id === cId) || categories[categories.length-1];
                const pct = maxCatVal > 0 ? (val / maxCatVal) * 100 : 0;
                return `<div style="margin-bottom:6px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px;">
                    <span>${c.icon} ${c.name}</span>
                    <span style="font-weight:bold;">${val.toLocaleString()} ت</span>
                  </div>
                  <div style="background:#eee; border-radius:4px; height:6px; overflow:hidden;">
                    <div style="width:${pct}%; height:100%; background:${type === 'income' ? '#4caf50' : '#e74c3c'}; border-radius:4px;"></div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          ` : ''}
          <!-- Transaction list -->
          <div style="margin-bottom:12px;">
            <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">📝 تراکنش‌ها</div>
            ${monthTx.length === 0 ? '<p style="color:#888; text-align:center;">تراکنشی ثبت نشده</p>' : ''}
            ${monthTx.sort((a,b) => new Date(b.date) - new Date(a.date)).map((t, i) => {
              const c = categories.find(x => x.id === t.cat) || categories[categories.length-1];
              const globalIdx = transactions.indexOf(t);
              return `<div style="display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee;">
                <span style="font-size:20px;">${t.type === 'income' ? '💵' : c.icon}</span>
                <div style="flex:1;">
                  <div style="font-weight:bold; font-size:14px;">${t.desc || c.name}</div>
                  <div style="font-size:11px; color:#888;">${t.date}</div>
                </div>
                <span style="font-weight:bold; color:${t.type === 'income' ? '#2e7d32' : '#c62828'};">${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} ت</span>
                <button class="btn" data-del-tx="${globalIdx}" style="padding:2px 6px; font-size:11px;">✕</button>
              </div>`;
            }).join('')}
          </div>
          <button class="btn" id="exp-export" style="width:100%;">📥 خروجی CSV</button>
        </div>`;

      // Type toggle
      container.querySelector('#exp-type-exp').onclick = () => { type = 'expense'; renderUI(); };
      container.querySelector('#exp-type-inc').onclick = () => { type = 'income'; renderUI(); };

      // Category select
      container.querySelectorAll('[data-exp-cat]').forEach(btn => {
        btn.onclick = () => { cat = btn.dataset.expCat; renderUI(); };
      });

      // Month navigation
      container.querySelector('#exp-prev-m').onclick = () => {
        const cm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
        let m = cm.m - 1, y = cm.y;
        if (m < 1) { m = 12; y--; }
        viewMonth = { y, m };
        renderUI();
      };
      container.querySelector('#exp-next-m').onclick = () => {
        const cm = viewMonth || { y: now.getFullYear(), m: now.getMonth() + 1 };
        let m = cm.m + 1, y = cm.y;
        if (m > 12) { m = 1; y++; }
        viewMonth = { y, m };
        renderUI();
      };

      // Add transaction
      const amountInput = container.querySelector('#exp-amount');
      const dateInput = container.querySelector('#exp-date');
      const descInput = container.querySelector('#exp-desc');
      container.querySelector('#exp-add').onclick = () => {
        const amount = parseFloat(amountInput.value);
        if (!amount || amount <= 0) { showToast('مبلغ را وارد کنید', 'error'); return; }
        transactions.push({ type, cat, amount, date: dateInput.value || todayDate(), desc: descInput.value.trim() });
        save();
        showToast('تراکنش ثبت شد ✓');
        renderUI();
      };

      // Delete
      container.querySelectorAll('[data-del-tx]').forEach(btn => {
        btn.onclick = () => {
          transactions.splice(parseInt(btn.dataset.delTx), 1);
          save();
          renderUI();
        };
      });

      // Export CSV
      container.querySelector('#exp-export').onclick = () => {
        const header = 'type,category,amount,date,description\n';
        const rows = transactions.map(t => {
          const c = categories.find(x => x.id === t.cat);
          return `${t.type},${c ? c.name : t.cat},${t.amount},${t.date},"${t.desc || ''}"`;
        }).join('\n');
        const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `expenses_${vm.y}_${String(vm.m).padStart(2,'0')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('فایل CSV دانلود شد ✓');
      };
    }

    renderUI();
  }
};

// 10. prod-workout — تایمر ورزشی 🏋️
// ─────────────────────────────────────────────
const workoutTool = {
  id: 'prod-workout',
  name: 'تایمر ورزشی',
  icon: '🏋️',
  category: 'productivity',
  keywords: ['workout', 'timer', 'tabata', 'hiit', 'exercise', 'ورزش', 'تایمر', 'تمرین'],
  desc: 'تایمر تمرینات ورزشی با حالت‌های Tabata و HIIT',
  render(container) {
    const presets = {
      tabata: { name: 'Tabata', work: 20, rest: 10, rounds: 8 },
      hiit: { name: 'HIIT', work: 30, rest: 15, rounds: 10 },
      custom: { name: 'سفارشی', work: 30, rest: 15, rounds: 6 },
    };

    let preset = 'tabata';
    let workSec = presets.tabata.work;
    let restSec = presets.tabata.rest;
    let totalRounds = presets.tabata.rounds;
    let currentRound = 0;
    let phase = 'ready'; // ready | work | rest | done
    let timeLeft = 0;
    let totalTime = 0;
    let interval = null;
    let running = false;

    function totalDuration() { return totalRounds * (workSec + restSec); }

    function beep(freq, dur) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq || 880;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(ctx.currentTime + (dur || 0.2));
        setTimeout(() => ctx.close(), (dur || 0.2) * 1000 + 200);
      } catch {}
    }

    function doubleBeep() {
      beep(880, 0.15);
      setTimeout(() => beep(1200, 0.15), 200);
    }

    function tripleBeep() {
      beep(660, 0.1);
      setTimeout(() => beep(880, 0.1), 150);
      setTimeout(() => beep(1200, 0.2), 300);
    }

    function fmt(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function phaseInfo() {
      if (phase === 'ready') return { label: 'آماده', color: '#2196f3', bg: '#e3f2fd' };
      if (phase === 'work') return { label: 'کار', color: '#e74c3c', bg: '#ffebee' };
      if (phase === 'rest') return { label: 'استراحت', color: '#27ae60', bg: '#e8f5e9' };
      return { label: 'تمام!', color: '#ff9800', bg: '#fff3e0' };
    }

    function start() {
      if (phase === 'ready' || phase === 'done') {
        currentRound = 1;
        phase = 'work';
        timeLeft = workSec;
        totalTime = 0;
        doubleBeep();
      }
      running = true;
      interval = setInterval(() => {
        timeLeft--;
        totalTime++;
        if (timeLeft <= 0) {
          if (phase === 'work') {
            beep(1200, 0.3);
            if (currentRound >= totalRounds) {
              phase = 'done';
              running = false;
              clearInterval(interval);
              tripleBeep();
              renderUI();
              return;
            }
            phase = 'rest';
            timeLeft = restSec;
          } else if (phase === 'rest') {
            doubleBeep();
            currentRound++;
            phase = 'work';
            timeLeft = workSec;
          }
        }
        // Update display without full re-render
        const display = container.querySelector('#workout-display');
        const roundEl = container.querySelector('#workout-round');
        const phaseEl = container.querySelector('#workout-phase');
        const progress = container.querySelector('#workout-progress');
        const btn = container.querySelector('#workout-start');
        if (display) display.textContent = fmt(timeLeft);
        if (roundEl) roundEl.textContent = `${currentRound} / ${totalRounds}`;
        if (phaseEl) {
          const pi = phaseInfo();
          phaseEl.textContent = pi.label;
          phaseEl.style.color = pi.color;
        }
        if (progress) {
          const pct = totalTime / totalDuration() * 100;
          progress.style.width = `${Math.min(pct, 100)}%`;
        }
        if (btn) btn.textContent = running ? '⏸ مکث' : '▶ شروع';
      }, 1000);
      renderUI();
    }

    function pause() {
      running = false;
      clearInterval(interval);
      renderUI();
    }

    function reset() {
      running = false;
      clearInterval(interval);
      phase = 'ready';
      currentRound = 0;
      timeLeft = 0;
      totalTime = 0;
      renderUI();
    }

    function applyPreset(key) {
      preset = key;
      const p = presets[key];
      workSec = p.work;
      restSec = p.rest;
      totalRounds = p.rounds;
      reset();
    }

    function renderUI() {
      const pi = phaseInfo();
      const progressPct = phase === 'ready' ? 0 : Math.min(totalTime / totalDuration() * 100, 100);

      container.innerHTML = `
        <div class="card">
          <h3>🏋️ تایمر ورزشی</h3>
          <!-- Presets -->
          <div style="display:flex; gap:8px; margin-bottom:16px;">
            ${Object.entries(presets).map(([k, p]) => `
              <button class="btn ${preset === k ? '' : 'btn-outline'}" data-wpreset="${k}" style="flex:1; font-size:13px;">
                ${k === 'tabata' ? '⚡' : k === 'hiit' ? '🔥' : '⚙️'} ${p.name}
              </button>
            `).join('')}
          </div>
          <!-- Custom settings -->
          ${preset === 'custom' ? `
            <div style="display:flex; gap:12px; margin-bottom:16px; justify-content:center;">
              <div class="input-group" style="text-align:center;">
                <label style="font-size:12px;">کار (ثانیه)</label>
                <input type="number" id="w-work" value="${workSec}" min="5" max="300" style="width:60px; text-align:center;" />
              </div>
              <div class="input-group" style="text-align:center;">
                <label style="font-size:12px;">استراحت (ثانیه)</label>
                <input type="number" id="w-rest" value="${restSec}" min="5" max="120" style="width:60px; text-align:center;" />
              </div>
              <div class="input-group" style="text-align:center;">
                <label style="font-size:12px;">دورها</label>
                <input type="number" id="w-rounds" value="${totalRounds}" min="1" max="50" style="width:60px; text-align:center;" />
              </div>
            </div>
          ` : ''}
          <!-- Main display -->
          <div style="text-align:center; padding:24px; background:${pi.bg}; border-radius:16px; margin-bottom:16px;">
            <div id="workout-phase" style="font-size:18px; font-weight:bold; color:${pi.color}; margin-bottom:8px;">${pi.label}</div>
            <div id="workout-display" style="font-size:72px; font-weight:bold; font-family:monospace; color:${pi.color};">
              ${phase === 'ready' ? fmt(workSec) : fmt(timeLeft)}
            </div>
            <div id="workout-round" style="font-size:16px; color:#666; margin-top:8px;">
              ${phase === 'ready' ? `دور: ${totalRounds} × ${workSec}s/${restSec}s` : `${currentRound} / ${totalRounds}`}
            </div>
          </div>
          <!-- Progress bar -->
          <div style="background:#eee; border-radius:8px; height:8px; overflow:hidden; margin-bottom:16px;">
            <div id="workout-progress" style="width:${progressPct}%; height:100%; background:linear-gradient(90deg, #4caf50, #ff9800); border-radius:8px; transition:width 0.3s;"></div>
          </div>
          <!-- Controls -->
          <div style="display:flex; gap:12px; justify-content:center;">
            <button class="btn" id="workout-start" style="flex:1; font-size:18px; padding:12px;">
              ${running ? '⏸ مکث' : phase === 'ready' ? '▶ شروع' : phase === 'done' ? '🔄 شروع مجدد' : '▶ ادامه'}
            </button>
            <button class="btn" id="workout-reset" style="font-size:18px; padding:12px 20px;">⟲</button>
          </div>
          <!-- Info -->
          <div style="margin-top:16px; display:flex; justify-content:center; gap:20px; font-size:12px; color:#888;">
            <span>⏱ کل: ${fmt(totalDuration())}</span>
            <span>🔥 ${workSec}s کار</span>
            <span>😴 ${restSec}s استراحت</span>
          </div>
        </div>`;

      // Preset buttons
      container.querySelectorAll('[data-wpreset]').forEach(btn => {
        btn.onclick = () => applyPreset(btn.dataset.wpreset);
      });

      // Custom inputs
      const wWork = container.querySelector('#w-work');
      const wRest = container.querySelector('#w-rest');
      const wRounds = container.querySelector('#w-rounds');
      if (wWork) wWork.onchange = () => { workSec = parseInt(wWork.value) || 30; };
      if (wRest) wRest.onchange = () => { restSec = parseInt(wRest.value) || 15; };
      if (wRounds) wRounds.onchange = () => { totalRounds = parseInt(wRounds.value) || 6; };

      // Controls
      container.querySelector('#workout-start').onclick = () => {
        if (running) pause();
        else start();
      };
      container.querySelector('#workout-reset').onclick = reset;
    }

    renderUI();
  }
};

      const MORSE_MAP = {

      m2tBtn.onclick = () => { mode = 'm2t'; m2tBtn.classList.add('active'); t2mBtn.classList.remove('active'); };

        const inp = container.querySelector('#morse-in').value.trim();
        if (mode === 't2m') {
          const result = inp.toUpperCase().split('').map(c => MORSE_MAP[c] || c).join(' ');
          container.querySelector('#morse-out').textContent = result;
        } else {
          const result = inp.split(' ').map(code => REVERSE_MORSE[code] || code).join('');
          container.querySelector('#morse-out').textContent = result;
        }
      };

      container.querySelector('#morse-play').onclick = () => {
        const morseText = container.querySelector('#morse-out').textContent || container.querySelector('#morse-in').value;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        let time = ctx.currentTime;
        const dot = 0.08, dash = dot * 3, gap = dot, letterGap = dot * 3, wordGap = dot * 7;

        for (const char of morseText) {
          if (char === '.') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 700;
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.setValueAtTime(0, time + dot);
            osc.start(time); osc.stop(time + dot);
            time += dot + gap;
          } else if (char === '-') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 700;
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.setValueAtTime(0, time + dash);
            osc.start(time); osc.stop(time + dash);
            time += dash + gap;
          } else if (char === ' ') {
            time += letterGap;
          } else if (char === '/') {
            time += wordGap;
          }
        }
      };

      container.querySelector('#morse-copy').onclick = () => {
        navigator.clipboard.writeText(container.querySelector('#morse-out').textContent);
        showToast('کپی شد!');
      };

        const text = container.querySelector('#rx-text').value;
        if (!pattern) { showToast('الگو خالی است'); return; }

        try {
          const re = new RegExp(pattern, flags);
          let matches = [];
          let match;
          const allMatches = [];

          if (flags.includes('g')) {
            while ((match = re.exec(text)) !== null) {
              allMatches.push({ index: match.index, length: match[0].length, groups: [...match] });
              if (match[0].length === 0) re.lastIndex++;
            }
          } else {
            match = re.exec(text);
            if (match) allMatches.push({ index: match.index, length: match[0].length, groups: [...match] });
          }

          // Highlight
          let html = '';
          let last = 0;
          allMatches.forEach(m => {
            html += escapeHtml(text.slice(last, m.index));
            html += `<mark style="background:#fbbf24;color:#000;padding:1px 2px;border-radius:3px;">${escapeHtml(text.slice(m.index, m.index + m.length))}</mark>`;
            last = m.index + m.length;
          });
          html += escapeHtml(text.slice(last));
          container.querySelector('#rx-highlighted').innerHTML = html || '<span style="color:#888;">بدون تطابق</span>';

          // Groups
          if (allMatches.length > 0 && allMatches[0].groups.length > 1) {
            const groupsHtml = allMatches.map((m, i) => {
              const g = m.groups.slice(1).map((g, gi) => `<span style="color:#60a5fa;">گروه ${gi + 1}:</span> ${escapeHtml(g || '(خالی)')}`).join(' | ');
              return `<div style="font-size:12px;padding:4px 0;">تطابق ${i + 1}: ${g}</div>`;

            container.querySelector('#rx-groups').innerHTML = groupsHtml;
          } else {
            container.querySelector('#rx-groups').innerHTML = '';
          }

          container.querySelector('#rx-info').textContent = `${allMatches.length} تطابق یافت شد`;
        } catch (e) {
          showToast('خطا: ' + e.message);
        }
      };

      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
    }
  },
